<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171316">
  <title>Telão</title>
  <link rel="stylesheet" href="/telao/style.css">
</head>
<body>
  <main class="telao">
    <section class="player-card" aria-label="Player de vídeo">
      <div class="video-shell">
        <video id="video" controls playsinline preload="metadata">
          <source src="/api/telao/video" type="video/mp4">
        </video>
        <div class="video-error" id="videoError" hidden>Não foi possível carregar o vídeo. Atualize a página e tente novamente.</div>
      </div>
      <div class="player-tools">
        <div class="chapter-current"><span class="chapter-index" id="chapterIndex">01</span><strong id="chapterTitle">Capítulo 1</strong></div>
        <div class="step-controls">
          <button class="step-button" id="previous" type="button" aria-label="Voltar ao capítulo anterior">← <span>Anterior</span></button>
          <button class="step-button step-next" id="next" type="button" aria-label="Avançar para o próximo capítulo"><span>Próximo</span> →</button>
        </div>
      </div>
      <div class="chapter-progress"><span id="progressFill"></span></div>
    </section>
    <section class="chapters-section" aria-label="Capítulos">
      <div class="chapter-list" id="chapters"></div>
    </section>
  </main>
  <script src="/telao/app.js" defer></script>
</body>
</html>
