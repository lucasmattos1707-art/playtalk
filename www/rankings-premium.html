<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rankings • FluentLevelUp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:dark;--fg:#f5f8ff;--muted:#a9bbd5;--line:rgba(134,177,225,.13);--active:#4db8ff;--active-rgb:77,184,255}
*{box-sizing:border-box}html{min-height:100%;background:#06101f}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:#06101f;overflow-x:hidden}
/* O fundo ocupa a tela inteira. Nenhum container externo arredondado. */
body::before{content:"";position:fixed;inset:-35%;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 15% 25%,rgba(0,107,219,.22),transparent 41%),radial-gradient(ellipse at 84% 18%,rgba(35,184,212,.13),transparent 35%),radial-gradient(ellipse at 65% 83%,rgba(91,44,172,.16),transparent 44%),linear-gradient(130deg,#051021,#09182d 48%,#050e1c);animation:floatBg 21s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.16))}
@keyframes floatBg{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(2%,-2%,0) scale(1.06)}100%{transform:translate3d(-1%,2%,0) scale(1.02)}}
.page{width:min(1220px,100%);margin:0 auto;padding:36px 38px 80px}.topbar{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}.heading{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}.brand-icon{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#244779,#12233d);border:1px solid rgba(125,173,255,.25);box-shadow:0 8px 32px rgba(0,76,164,.18),inset 0 1px 1px rgba(255,255,255,.13);color:#ffcb49}.brand-icon svg{width:38px;height:38px;filter:drop-shadow(0 0 9px rgba(255,196,48,.32))}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.65px;margin:0;font-weight:800;line-height:1.1}.close{position:absolute;right:0;top:50%;transform:translateY(-50%);border:1px solid rgba(185,219,255,.16);color:#d5e8ff;background:rgba(24,54,88,.7);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:27px;cursor:pointer;transition:background .2s,transform .2s}.close:hover{background:rgba(50,91,133,.9);transform:translateY(-50%) rotate(90deg)}
.tabs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:11px;align-items:start;margin:0 0 24px;padding:0 0 27px;border-bottom:1px solid rgba(154,191,234,.1)}.tab{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:#d7e2f2;padding:4px 0 12px;position:relative;font:600 12px/1.2 Inter,sans-serif;min-width:0;transition:transform .2s}.tab:hover{transform:translateY(-3px)}.tab .tile{width:59px;height:59px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 7px 20px rgba(0,0,0,.20),inset 0 1px rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.13);transition:box-shadow .25s,transform .25s}.tab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}.tab .label{max-width:100%;overflow-wrap:anywhere}.tab[aria-selected=true] .tile{box-shadow:0 0 0 2px rgba(255,255,255,.16),0 0 25px var(--glow),inset 0 1px rgba(255,255,255,.28);transform:translateY(-2px)}.tab[aria-selected=true]::after{content:"";position:absolute;bottom:-2px;width:68%;height:3px;border-radius:5px;background:var(--c1);box-shadow:0 0 12px var(--glow)}
.context{display:flex;justify-content:center;align-items:center;gap:15px;margin:5px 0 16px;text-align:center}.context h2{font-size:clamp(21px,3vw,29px);letter-spacing:-.4px;font-weight:750;margin:0;text-transform:none}
.leaderboard{display:flex;flex-direction:column;gap:10px}.row{display:grid;grid-template-columns:98px 70px minmax(0,1fr) auto;align-items:center;min-height:91px;padding:9px 19px 9px 10px;border-radius:17px;border:1px solid rgba(122,169,224,.19);background:linear-gradient(110deg,rgba(17,42,70,.67),rgba(7,23,43,.75));box-shadow:inset 0 1px rgba(255,255,255,.025);position:relative;overflow:hidden;transition:transform .2s,background .2s,border-color .2s}.row:hover{transform:translateX(3px);background:linear-gradient(110deg,rgba(25,57,91,.84),rgba(9,28,53,.9));border-color:rgba(129,186,247,.37)}.row.podium{border-color:var(--rim);background:linear-gradient(100deg,var(--tint),rgba(13,27,46,.8) 36%,rgba(8,23,42,.73))}.row.podium::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--medal);box-shadow:0 0 16px var(--medal)}.rank{display:flex;align-items:center;justify-content:center;gap:5px;font-size:25px;font-weight:800;letter-spacing:-1px;color:#d7e7fa}.podium .rank{color:var(--medal)}.rank .laurel{font-size:25px;font-family:Georgia,serif;opacity:.85}.plain-rank{font-size:19px;border-radius:12px;background:rgba(89,133,183,.15);border:1px solid rgba(140,180,220,.1);padding:9px 12px}.avatar{width:66px;height:66px;object-fit:cover;border-radius:50%;border:2px solid var(--avatar-border,rgba(196,222,251,.65));box-shadow:0 4px 14px rgba(0,0,0,.22)}.name{min-width:0;padding:0 12px;font-size:clamp(16px,2vw,22px);font-weight:750;letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.you{font-size:10px;letter-spacing:.08em;color:#94d8ff;border:1px solid rgba(77,184,255,.43);border-radius:7px;padding:4px 6px;margin-left:8px;vertical-align:middle}.value{display:flex;align-items:center;gap:9px;border:1px solid rgba(62,159,243,.25);border-radius:14px;background:linear-gradient(120deg,rgba(8,74,125,.56),rgba(15,56,97,.49));padding:12px 15px;white-space:nowrap}.value svg{width:20px;height:20px;stroke:#36d5ff;fill:none;stroke-width:2.25}.value strong{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.7px}.value .unit{font-size:13px;font-weight:500;color:#b9d1ea}.row.me{outline:1px solid rgba(72,180,255,.7);outline-offset:-2px}
@media(max-width:820px){.page{padding:24px 20px 52px}.tabs{grid-template-columns:repeat(5,minmax(0,1fr));column-gap:7px;row-gap:15px}.tab .tile{width:56px;height:56px}.tab{font-size:11px}.row{grid-template-columns:62px 57px minmax(0,1fr) auto;min-height:80px;padding:8px 10px 8px 3px}.rank{font-size:19px}.rank .laurel{display:none}.avatar{width:51px;height:51px}.name{font-size:16px;padding:0 6px}.value{padding:9px 10px;gap:5px}.value strong{font-size:16px}.value svg{width:17px;height:17px}}
@media(max-width:440px){.page{padding:20px 12px 45px}.topbar{margin-bottom:24px}.heading{gap:10px}.brand-icon{width:49px;height:49px;border-radius:14px}.brand-icon svg{width:30px;height:30px}h1{font-size:27px;letter-spacing:-1px}.close{width:36px;height:36px;font-size:22px}.tabs{gap:12px 2px;margin-bottom:19px;padding-bottom:20px}.tab{font-size:9px;gap:7px;padding:2px 0 9px}.tab .tile{width:min(51px,11.7vw);height:min(51px,11.7vw);border-radius:14px}.tab svg{width:24px;height:24px}.row{grid-template-columns:43px 44px minmax(0,1fr) auto;min-height:68px;border-radius:12px;padding:7px 7px 7px 1px;gap:0}.rank{font-size:15px}.plain-rank{font-size:13px;padding:6px}.avatar{width:41px;height:41px}.name{font-size:13px;padding:0 5px;letter-spacing:-.2px}.value{border-radius:10px;padding:8px 7px;gap:3px}.value strong{font-size:12px;letter-spacing:-.25px}.value svg{width:13px;height:13px}.value .unit{font-size:10px}.you{display:none}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<!-- Biblioteca SVG local: funciona sem biblioteca de ícones externa. -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v8a5 5 0 0 1-10 0V4ZM7 6H4v3a4 4 0 0 0 4 4m9-7h3v3a4 4 0 0 1-4 4M12 17v4m-5 0h10"/></symbol><symbol id="headphones" viewBox="0 0 24 24"><path d="M3 14v-3a9 9 0 0 1 18 0v3M3 14h4v7H6a3 3 0 0 1-3-3v-4Zm18 0h-4v7h1a3 3 0 0 0 3-3v-4Z"/></symbol><symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4m-4 0h8"/></symbol><symbol id="wave" viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 3-16 3 20 2-10h4"/></symbol><symbol id="star" viewBox="0 0 24 24"><path d="m12 2 3.2 6.5 7.2 1-5.2 5.1 1.2 7.2L12 18.4l-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1L12 2Z"/></symbol><symbol id="keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/></symbol><symbol id="flame" viewBox="0 0 24 24"><path d="M12 22c4.6 0 8-3.1 8-7.4 0-3.2-1.9-5.7-3.5-7.2.1 3.2-1.8 3.9-2.5 4.1C14 6.7 11.1 3.6 9 2c.3 4.7-1.3 6.4-3.1 8.5A7.7 7.7 0 0 0 4 15c0 4.1 3.4 7 8 7Z"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18m-13 5 3 3 5-5"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol><symbol id="spark" viewBox="0 0 24 24"><path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2Z"/></symbol></svg>
<main class="page">
<header class="topbar"><div class="heading"><div class="brand-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none"><use href="#trophy"/></svg></div><div><h1>Rankings</h1></div></div><button class="close" id="closeRankings" aria-label="Fechar">×</button></header>
<nav class="tabs" role="tablist" aria-label="Categorias de ranking" id="tabs"></nav>
<section class="context" aria-live="polite"><h2 id="categoryTitle">Geral</h2></section>
<section class="leaderboard" id="board" aria-label="Tabela de classificação">Carregando rankings…</section>
<input id="botPhoto" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</main>
<script src="js/api-config.js"></script>
<script>
const categories=[
 {id:'geral',name:'Geral',icon:'trophy',c1:'#eabf53',c2:'#b67a16',glow:'rgba(247,190,65,.35)',unit:'pts'},
 {id:'listening',name:'Listening',metric:'listening',icon:'headphones',c1:'#168cff',c2:'#0759cc',glow:'rgba(0,125,255,.35)',unit:'palavras'},
 {id:'speaking',name:'Speaking',metric:'speaking',icon:'mic',c1:'#ff4c85',c2:'#ce225c',glow:'rgba(255,65,125,.35)',unit:'palavras'},
 {id:'pronuncia',name:'Pronúncia',metric:'pronunciation',icon:'wave',c1:'#b754ff',c2:'#7021d8',glow:'rgba(164,77,255,.35)',unit:'%'},
 {id:'nivel',name:'Nível',metric:'level',icon:'star',c1:'#ffc92f',c2:'#ee9700',glow:'rgba(255,180,30,.35)',unit:'nível'},
 {id:'velocidade',name:'Velocidade',metric:'building',icon:'keyboard',c1:'#24d3dc',c2:'#0099a2',glow:'rgba(0,210,210,.3)',unit:'CPM'},
 {id:'meaning',name:'Meaning',metric:'meaning',icon:'flame',c1:'#ffab26',c2:'#f05c08',glow:'rgba(255,123,25,.35)',unit:'%'},
 {id:'consistencia',name:'Consistência',metric:'consistency',icon:'calendar',c1:'#12dc80',c2:'#009a59',glow:'rgba(20,208,125,.35)',unit:'dias'},
 {id:'tempo',name:'Tempo',metric:'practice',icon:'clock',c1:'#268eff',c2:'#0454d5',glow:'rgba(38,146,255,.4)',unit:'min'},
 {id:'xp',name:'XP',metric:'xp',icon:'spark',c1:'#8ca4ff',c2:'#4952ce',glow:'rgba(130,144,255,.35)',unit:'XP'}
];
const icon=id=>`<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
const tabs=document.querySelector('#tabs'),board=document.querySelector('#board');
const viewerId=Number(new URLSearchParams(location.search).get('viewerId'))||0;
const isAdmin=new URLSearchParams(location.search).get('admin')==='1';
const fmt=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
let users=[],selected='geral',botPhotoUser=0;
const pointsForRank=rank=>rank>300?0:Math.round((1000-(rank-1)*(990/299))*10)/10;
function makeRankings(){
 const metricRows=new Map();
 categories.filter(category=>category.metric).forEach(category=>{
  const ordered=users.slice().sort((a,b)=>(Number(b.values?.[category.metric])||0)-(Number(a.values?.[category.metric])||0)||a.name.localeCompare(b.name));
  metricRows.set(category.id,ordered.map((user,index)=>({...user,rank:index+1,score:Number(user.values?.[category.metric])||0,points:pointsForRank(index+1)})));
 });
 const totals=new Map(users.map(user=>[Number(user.id),0]));
 metricRows.forEach(rows=>rows.forEach(user=>totals.set(Number(user.id),(totals.get(Number(user.id))||0)+user.points)));
 const overall=users.map(user=>({...user,rank:0,score:Math.round((totals.get(Number(user.id))||0)*10)/10,points:Math.round((totals.get(Number(user.id))||0)*10)/10}))
  .sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)).map((user,index)=>({...user,rank:index+1}));
 metricRows.set('geral',overall);
 return metricRows;
}
function showBotPhoto(userId,file){
 if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){alert('Escolha uma imagem JPEG, PNG ou WebP de até 8 MB.');return;}
 const reader=new FileReader();reader.onload=()=>void updateBot(userId,{imageDataUrl:reader.result});reader.readAsDataURL(file);
}
async function updateBot(userId,data){
 try{const api=window.PlaytalkApi;const response=await fetch(api.buildApiUrl(`/api/admin/game-ranking-bots/${userId}`),{method:'PATCH',credentials:'include',headers:api.buildAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(data)});const payload=await response.json().catch(()=>({}));if(!response.ok||!payload.success)throw new Error(payload.message||'Não foi possível atualizar o bot.');await loadRankings();}
 catch(error){alert(error.message||'Não foi possível atualizar o bot.');}
}
function bindBotHold(element,action){
 let timer=0,x=0,y=0;const cancel=()=>{if(timer)clearTimeout(timer);timer=0;};
 element.addEventListener('pointerdown',event=>{if(event.button!==0)return;cancel();x=event.clientX;y=event.clientY;timer=setTimeout(()=>{timer=0;action();},1000);});
 element.addEventListener('pointermove',event=>{if(Math.hypot(event.clientX-x,event.clientY-y)>12)cancel();});
 ['pointerup','pointercancel','pointerleave'].forEach(name=>element.addEventListener(name,cancel));
 element.addEventListener('contextmenu',event=>event.preventDefault());
}
function render(id=selected){
 selected=id;const category=categories.find(item=>item.id===id)||categories[0];const rankings=makeRankings();tabs.replaceChildren();
 categories.forEach(item=>{const button=document.createElement('button');button.type='button';button.className='tab';button.setAttribute('role','tab');button.setAttribute('aria-selected',String(item.id===id));button.setAttribute('aria-label',`Ranking ${item.name}`);button.dataset.id=item.id;button.style.cssText=`--c1:${item.c1};--c2:${item.c2};--glow:${item.glow}`;button.innerHTML=`<span class="tile">${icon(item.icon)}</span><span class="label">${item.name}</span>`;button.addEventListener('click',()=>render(item.id));tabs.append(button);});
 document.querySelector('#categoryTitle').textContent=category.name;
 const rows=rankings.get(id)||[];board.replaceChildren();
 if(!rows.length){board.textContent='Ainda não há jogadores neste ranking.';return;}
 const medalColors=['#ffd451','#d9e8f8','#ffb56b'],tints=['rgba(124,81,12,.39)','rgba(88,115,148,.27)','rgba(130,75,38,.28)'],rims=['rgba(244,187,59,.58)','rgba(170,204,237,.41)','rgba(231,147,91,.42)'];
 rows.forEach((user,index)=>{const podium=index<3,row=document.createElement('article');row.className='row'+(podium?' podium':'')+(Number(user.id)===viewerId?' me':'');row.style.cssText=`--medal:${medalColors[index]||'#cad8e9'};--tint:${tints[index]||'transparent'};--rim:${rims[index]||'transparent'};--avatar-border:${podium?medalColors[index]:'rgba(196,222,251,.65)'}`;
 const rank=document.createElement('div');rank.className='rank';rank.innerHTML=podium?`<span class="laurel">❧</span>${index+1}º<span class="laurel" style="transform:scaleX(-1)">❧</span>`:`<span class="plain-rank">${index+1}º</span>`;
 const avatar=document.createElement('img');avatar.className='avatar';avatar.src=user.avatar||'/Avatar/profile-neon-blue.svg';avatar.alt='';avatar.loading='lazy';
 const name=document.createElement('div');name.className='name';name.textContent=user.name;name.title=user.name;
 const value=document.createElement('div');value.className='value';const valueIcon=id==='geral'?'trophy':category.icon;value.innerHTML=`${icon(valueIcon)}<strong></strong><span class="unit"></span>`;
 const number=id==='geral'?Number(user.score)||0:Number(user.score)||0;value.querySelector('strong').textContent=fmt.format(number);value.querySelector('.unit').textContent=category.unit;
 if(isAdmin&&user.isBot){bindBotHold(name,()=>{const next=prompt('Novo nome do bot:',user.name);if(next&&next!==user.name)void updateBot(user.id,{name:next});});bindBotHold(avatar,()=>{botPhotoUser=user.id;document.querySelector('#botPhoto').click();});}
 row.append(rank,avatar,name,value);board.append(row);
 });
}
async function loadRankings(){
 board.textContent='Carregando rankings…';
 try{const api=window.PlaytalkApi;const response=await fetch(api.buildApiUrl('/api/flashcards/game-rankings'),{credentials:'include',cache:'no-store',headers:api.buildAuthHeaders()});const payload=await response.json().catch(()=>({}));if(!response.ok||!payload.success)throw new Error(response.status===401?'Entre na sua conta para ver os rankings.':'Não foi possível carregar os rankings.');users=Array.isArray(payload.users)?payload.users:[];render(selected);}
 catch(error){board.textContent=error.message||'Não foi possível carregar os rankings.';}
}
document.querySelector('#closeRankings').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'close-premium-rankings'},location.origin);else if(history.length>1)history.back();else location.href='play.html';});
document.querySelector('#botPhoto').addEventListener('change',event=>{const file=event.target.files?.[0];if(file&&botPhotoUser)showBotPhoto(botPhotoUser,file);event.target.value='';});
void loadRankings();
</script>
</body>
</html>
