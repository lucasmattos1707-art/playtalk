<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Timeline</title>
  <style>
    :root{color-scheme:dark;--green:#65ff00;--pink:#ff2d95;--white:#fff;--muted:#a8a8a8;--panel:#101010;--line:#292929}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#050505;color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(760px,100%);margin:0 auto;padding:clamp(20px,5vw,44px) clamp(16px,5vw,36px) 44px}
    .player{position:sticky;top:0;z-index:5;padding:18px 20px 16px;background:rgba(9,9,9,.94);border:1px solid #252525;border-radius:22px;box-shadow:0 14px 42px #000;backdrop-filter:blur(16px)}
    .controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:0 0 20px}
    button{font:inherit;color:inherit;border:0;cursor:pointer}
    .skip{width:46px;height:46px;border:1px solid #353535;border-radius:50%;background:#151515;display:grid;place-items:center;transition:transform .18s,border-color .18s}
    .skip:hover{border-color:var(--green);transform:scale(1.06)}
    .skip svg{width:21px;height:21px}
    .play{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#050505;background:var(--green);box-shadow:0 0 24px #65ff0066;transition:transform .18s,box-shadow .18s}
    .play:hover{transform:scale(1.06);box-shadow:0 0 34px #65ff0099}
    .play svg{width:25px;height:25px}
    .seek-row{display:grid;grid-template-columns:52px 1fr 52px;gap:12px;align-items:center}
    .time{font-variant-numeric:tabular-nums;font-size:12px;color:#c4c4c4;text-align:center}
    .range-wrap{position:relative;height:22px;display:flex;align-items:center;--fill:0%}
    .track{position:absolute;left:0;right:0;height:4px;border-radius:5px;background:#303030;overflow:hidden}
    .track-fill{height:100%;width:var(--fill);border-radius:inherit;background:var(--green);box-shadow:0 0 11px #65ff00aa}
    input[type=range]{appearance:none;-webkit-appearance:none;position:relative;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #111;box-shadow:0 0 0 2px var(--green),0 0 14px #65ff00aa}
    input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #111;box-shadow:0 0 0 2px var(--green),0 0 14px #65ff00aa}
    .musical{margin-top:13px}
    .musical .track{height:7px;background:#341326;overflow:visible}
    .musical .track-fill{background:var(--pink);box-shadow:0 0 13px #ff2d95aa}
    .musical input[type=range]::-webkit-slider-thumb{width:17px;height:17px;background:#fff;border:4px solid var(--pink);box-shadow:0 0 0 1px #fff,0 0 17px #ff2d95bb}
    .musical input[type=range]::-moz-range-thumb{width:10px;height:10px;background:#fff;border:4px solid var(--pink);box-shadow:0 0 0 1px #fff,0 0 17px #ff2d95bb}
    .chapters{margin:22px 0 0;padding:4px 0 0;list-style:none}
    .chapter{position:relative;display:grid;grid-template-columns:72px 1fr 10px;align-items:center;gap:14px;min-height:54px;padding:0 14px;border-bottom:1px solid #1c1c1c;color:#f6f6f6;text-align:left;background:transparent;width:100%;transition:background .16s,color .16s}
    .chapter:first-child{border-top:1px solid #1c1c1c}
    .chapter:hover{background:#14100f}
    .chapter[aria-current=true]{color:var(--green);background:linear-gradient(90deg,#65ff0010,transparent 78%)}
    .chapter-time{font-size:11px;font-weight:700;letter-spacing:.025em;font-variant-numeric:tabular-nums;color:var(--pink);white-space:nowrap}
    .chapter-name{font-size:15px;font-weight:550;letter-spacing:.005em}
    .chapter-dot{width:7px;height:7px;border-radius:50%;background:#383838}
    .chapter[aria-current=true] .chapter-dot{background:var(--green);box-shadow:0 0 10px var(--green)}
    @media(max-width:480px){main{padding:14px 12px 32px}.player{padding:15px 13px 13px;border-radius:18px}.controls{gap:18px;margin-bottom:15px}.skip{width:42px;height:42px}.play{width:56px;height:56px}.seek-row{grid-template-columns:44px 1fr 44px;gap:8px}.chapter{grid-template-columns:70px 1fr 8px;gap:8px;min-height:51px;padding:0 7px}.chapter-name{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <section class="player" aria-label="Player de áudio">
      <audio id="audio" preload="metadata" src="/timeline/Testeira.mp3"></audio>
      <div class="controls">
        <button class="skip" id="back" type="button" aria-label="Voltar 5 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5M12 8v8m-2-6 2-2"/></svg></button>
        <button class="play" id="play" type="button" aria-label="Reproduzir"><svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6c0-.8.87-1.28 1.54-.85l9.3 5.96a1.52 1.52 0 0 1 0 2.58l-9.3 5.96A1.02 1.02 0 0 1 8 18.4V5.6Z"/></svg></button>
        <button class="skip" id="forward" type="button" aria-label="Avançar 5 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5m-2-1v8m2-6-2-2"/></svg></button>
      </div>
      <div class="seek-row">
        <span class="time" id="track-time">00:00</span>
        <div class="range-wrap" id="track-range"><div class="track"><div class="track-fill"></div></div><input id="track-seek" type="range" min="0" max="1000" value="0" aria-label="Progresso da faixa selecionada"></div>
        <span class="time" aria-hidden="true"></span>
      </div>
      <div class="seek-row musical">
        <span class="time" aria-hidden="true"></span>
        <div class="range-wrap" id="musical-range"><div class="track"><div class="track-fill"></div></div><input id="musical-seek" type="range" min="0" max="1000" value="0" aria-label="Posição no musical"></div>
        <span class="time" id="duration">00:00</span>
      </div>
    </section>
    <ol class="chapters" id="chapters"></ol>
  </main>
  <script>
    const marks = [
      ['00:00:00','Abertura'],['00:02:02','Além do arco-íris'],['00:06:13','Dorothy e pintinhos'],['00:09:48','Dorothy e ovelhinhas'],
      ['00:13:05','Furacão de Oz'],['00:13:59','Dorothy e os Munchkins'],['00:20:04','Tijolos amarelos'],['00:23:31','Espantalho'],
      ['00:25:06','Homem de Lata'],['00:30:28','Leão'],['00:36:22','O derretimento'],['00:38:14','Sem perdão'],['00:41:58','Ódio'],
      ['00:45:52','Chapéu'],['00:46:34','É só dançar'],['00:50:53','Popular'],['00:54:51','Cidade das Esmeraldas'],
      ['00:56:48','Elphaba e Mágico'],['00:58:56','Desafiando a gravidade'],['01:04:13','Grand Finale 1'],['01:08:58','Grand Finale 2'],
      ['01:12:07','Mundo Feliz'],['01:15:28','Grand Finale 2'],['01:18:37','Encerramento']
    ].map(([time,name])=>({time,name,seconds:time.split(':').reduce((n,v)=>n*60+Number(v),0)}));
    const audio=document.querySelector('#audio'), play=document.querySelector('#play'), playIcon=document.querySelector('#play-icon');
    const trackSeek=document.querySelector('#track-seek'), musicalSeek=document.querySelector('#musical-seek');
    const trackWrap=document.querySelector('#track-range'), musicalWrap=document.querySelector('#musical-range');
    const trackTimeLabel=document.querySelector('#track-time'), durationLabel=document.querySelector('#duration'), list=document.querySelector('#chapters');
    const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
    list.innerHTML=marks.map((m,i)=>`<li><button class="chapter" type="button" data-index="${i}" aria-current="false"><span class="chapter-time">${m.time}</span><span class="chapter-name">${m.name}</span><span class="chapter-dot"></span></button></li>`).join('');
    function paintRange(input,wrap,value,max){const pct=max>0?Math.min(100,Math.max(0,value/max*100)):0;wrap.style.setProperty('--fill',`${pct}%`);input.value=String(Math.round(pct*10));}
    function activeMarkIndex(time){let active=0;for(let i=1;i<marks.length;i++){if(time>=marks[i].seconds)active=i;else break}return active;}
    function markEnd(index,duration){return index+1<marks.length?Math.min(duration,marks[index+1].seconds):duration;}
    function render(){const t=audio.currentTime||0,d=audio.duration||0,index=activeMarkIndex(t),start=marks[index].seconds,end=Math.max(start,markEnd(index,d)),trackDuration=end-start;trackTimeLabel.textContent=fmt(t-start);durationLabel.textContent=fmt(d);paintRange(trackSeek,trackWrap,t-start,trackDuration);paintRange(musicalSeek,musicalWrap,t,d);list.querySelectorAll('.chapter').forEach((el,i)=>el.setAttribute('aria-current',String(i===index)));}
    function seek(value){if(Number.isFinite(audio.duration)){audio.currentTime=Math.max(0,Math.min(audio.duration,value));render();}}
    function sliderSeek(input){if(!audio.duration)return;if(input===musicalSeek){seek(Number(input.value)/1000*audio.duration);return;}const index=activeMarkIndex(audio.currentTime||0),start=marks[index].seconds,end=Math.max(start,markEnd(index,audio.duration));seek(start+Number(input.value)/1000*(end-start));}
    play.addEventListener('click',()=>audio.paused?audio.play().catch(()=>{}):audio.pause());
    audio.addEventListener('play',()=>{play.setAttribute('aria-label','Pausar');playIcon.innerHTML='<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';});
    audio.addEventListener('pause',()=>{play.setAttribute('aria-label','Reproduzir');playIcon.innerHTML='<path d="M8 5.6c0-.8.87-1.28 1.54-.85l9.3 5.96a1.52 1.52 0 0 1 0 2.58l-9.3 5.96A1.02 1.02 0 0 1 8 18.4V5.6Z"/>';});
    document.querySelector('#back').addEventListener('click',()=>seek((audio.currentTime||0)-5));
    document.querySelector('#forward').addEventListener('click',()=>seek((audio.currentTime||0)+5));
    trackSeek.addEventListener('input',()=>sliderSeek(trackSeek));musicalSeek.addEventListener('input',()=>sliderSeek(musicalSeek));
    list.addEventListener('click',e=>{const button=e.target.closest('.chapter');if(!button)return;seek(marks[Number(button.dataset.index)].seconds);audio.play().catch(()=>{});});
    ['loadedmetadata','durationchange','timeupdate','seeked'].forEach(event=>audio.addEventListener(event,render));
    render();
  </script>
</body>
</html>
