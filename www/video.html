<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d1a">
  <title>Vídeo • FluentLevelUp</title>
  <style>
    :root{color-scheme:dark;--gold:#f6ce68;--bg:#071d1a;--green:#0f4034;--text:#f5f7ed;--muted:#b9cec5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#185343,#071d1a 72%);color:var(--text);font:16px system-ui,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}button{border:1px solid #bda05d;background:#1d5547;color:white;padding:11px 16px;border-radius:11px;font-weight:700;cursor:pointer}button:hover{background:#28725b}button:disabled{opacity:.45;cursor:wait}.primary{background:#d9ad46;color:#17241c;border-color:var(--gold)}.primary:hover{background:var(--gold)}
    .wrap{max-width:1040px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:flex-end;align-items:center;min-height:28px}.admin-badge{color:var(--gold);font-size:13px;font-weight:800}.grid{display:grid;gap:18px}.card,.admin-box{background:#ffffff0b;border:1px solid #ffffff20;border-radius:18px;padding:16px}.card h2{margin:0 0 12px;font-size:20px;text-align:center;overflow-wrap:anywhere}.viewer{position:relative;width:min(100%,820px);aspect-ratio:16/9;margin:0 auto 10px;background:#020b09;border:1px solid #c7a24d;border-radius:12px;overflow:hidden;display:grid;place-items:center}.viewer canvas{width:100%;height:100%;object-fit:contain}.nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 9px;pointer-events:none}.nav button{pointer-events:auto;border-radius:50%;width:44px;height:44px;padding:0;font-size:27px;background:#061c1bd9}.dots{display:flex;justify-content:center;gap:9px;margin:10px}.dot{width:28px;height:28px;padding:0;border-radius:50%;background:#173f36;border-color:#527c6d}.dot.active{background:var(--gold);color:#15241b}.dot.chosen{box-shadow:0 0 0 3px #64dfb4}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.none-choice{border-color:#ff6b6b;color:#ff8585;background:#441f20}.none-choice:hover{background:#69292a}.none-mark{position:absolute;inset:0;display:grid;place-items:center;color:#ff4747;font-size:clamp(88px,20vw,190px);font-weight:300;line-height:1;text-shadow:0 4px 20px #000}.image-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#ffaaaa;background:#100b0bdc}.card-status{text-align:center;color:#bfe7d4;min-height:22px;margin:10px auto 0;font-size:14px}.card-status.is-none{display:grid;place-items:center;width:28px;height:28px;min-height:28px;border:2px solid #ff4747;border-radius:50%;color:#ff4747;font-size:24px;line-height:1}.admin-box{margin-bottom:20px}.admin-box h1{font-size:24px;color:var(--gold);margin:0 0 8px}.admin-box p{color:var(--muted);margin:0 0 15px}.admin-form{display:grid;grid-template-columns:1fr auto;gap:10px}.admin-form input[type=text],.admin-form input[type=file]{min-width:0;background:#071d1a;border:1px solid #78998a;color:white;padding:11px;border-radius:10px}.admin-form input[type=file]{grid-column:1/-1}.upload-status{min-height:22px;margin-top:8px;color:#cde5d9}.response-list{border-top:1px solid #ffffff24;margin-top:16px;padding-top:12px}.response{padding:9px 0;border-bottom:1px solid #ffffff17;color:#d5e8df;font-size:14px}.response:last-child{border:0}.response strong{color:var(--gold)}.empty{color:var(--muted);text-align:center;padding:34px 10px}.modal-backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.modal-backdrop[hidden]{display:none}.modal{width:min(100%,470px);background:#0d3028;border:1px solid #8a9c69;border-radius:18px;padding:20px;box-shadow:0 20px 80px #0009}.modal h2{margin:0 0 12px;color:var(--gold)}.modal textarea{width:100%;min-height:110px;resize:vertical;background:#071d1a;border:1px solid #638776;border-radius:10px;padding:12px;color:white}.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px}.modal-status{color:#ffb6a8;min-height:22px;margin-top:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#123e32;border:1px solid #7bab90;padding:10px 16px;border-radius:12px;z-index:8;max-width:calc(100vw - 24px);text-align:center}.toast[hidden]{display:none}
    @media(max-width:560px){.wrap{padding:12px 10px 40px}.card{padding:11px}.card h2{font-size:18px}.admin-form{grid-template-columns:1fr}.admin-form input[type=file]{grid-column:auto}.actions button{flex:1}.viewer{aspect-ratio:4/3}}
    body{padding-bottom:92px}.approval-footer{position:fixed;z-index:4;inset:auto 0 0;background:#061b18f2;border-top:1px solid #d9ad4680;padding:12px max(16px,calc((100vw - 1000px)/2));backdrop-filter:blur(12px);box-shadow:0 -8px 28px #0005}.approval-footer-inner{max-width:1000px;margin:auto;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px}.approval-footer strong{color:var(--gold);font-size:14px;white-space:nowrap}.approval-progress{height:12px;border:1px solid #739384;border-radius:999px;background:#102e27;overflow:hidden}.approval-progress-value{height:100%;width:0;background:linear-gradient(90deg,#d5a638,#ffe188);border-radius:inherit;transition:width .35s ease}@media(max-width:560px){body{padding-bottom:84px}.approval-footer{padding:11px 12px}.approval-footer-inner{grid-template-columns:1fr;gap:7px}.approval-footer strong{text-align:center;font-size:13px}.approval-progress{height:10px}}
    .viewer[hidden],.visitor-upload-preview[hidden]{display:none}.viewer canvas{touch-action:pan-y}.longpress-hint{text-align:center;color:var(--muted);font-size:13px;margin:-2px auto 10px}.visitor-submissions{display:grid;gap:14px}.visitor-submissions>h2{margin:8px 0 0;text-align:center;color:var(--gold)}.visitor-submission h3{text-align:center;margin:0 0 12px;color:var(--text);font-size:18px}.visitor-full-viewer{aspect-ratio:auto;min-height:180px}.visitor-full-image{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain}.approved-badge{width:max-content;max-width:100%;margin:10px auto 0;padding:6px 12px;border:1px solid #58c796;border-radius:999px;color:#9df0c6;font-weight:700;font-size:13px}.visitor-upload-preview{display:block;width:100%;max-height:55vh;object-fit:contain;border-radius:10px;margin-top:12px}.visitor-upload-file{display:block;width:100%;margin:12px 0;padding:10px;background:#071d1a;border:1px solid #638776;border-radius:10px;color:white}.visitor-upload-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><span class="admin-badge" id="adminBadge" hidden>ADMIN</span></div>
    <section class="grid" id="imageList" aria-live="polite"></section>
  </main>
  <footer class="approval-footer" aria-label="Progresso das aprovações">
    <div class="approval-footer-inner">
      <strong id="approvalProgressText">0 de 0 imagens aprovadas</strong>
      <div class="approval-progress" id="approvalProgress" role="progressbar" aria-label="Imagens aprovadas" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0">
        <div class="approval-progress-value" id="approvalProgressValue"></div>
      </div>
    </div>
  </footer>
  <div class="modal-backdrop" id="commentModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Sua escolha</h2>
      <textarea id="commentInput" maxlength="1000" placeholder="Escreva um comentário (opcional)"></textarea>
      <div class="modal-status" id="modalStatus" aria-live="polite"></div>
      <div class="modal-actions">
        <button id="commentBtn" class="primary" type="button">Comentar</button>
        <button id="approveBtn" type="button">Somente aprovar</button>
      </div>
    </section>
  </div>
  <div class="modal-backdrop" id="visitorUploadModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="visitorUploadTitle">
      <h2 id="visitorUploadTitle">Enviar imagem inteira</h2>
      <input class="visitor-upload-file" id="visitorImageInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Escolher imagem para enviar">
      <img class="visitor-upload-preview" id="visitorImagePreview" alt="Prévia da imagem inteira" hidden>
      <div class="modal-status" id="visitorUploadStatus" aria-live="polite"></div>
      <div class="visitor-upload-actions">
        <button id="visitorUploadCancel" type="button">Cancelar</button>
        <button id="visitorUploadBtn" class="primary" type="button" disabled>Enviar imagem</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/js/api-config.js"></script>
  <script src="/js/video-page.js?v=20261105-visitor-full-upload"></script>
</body>
</html>
