<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f8"><title>Acesso financeiro | Studio Arabesque</title><style>:root{--ink:#271e27;--soft:#786e78;--line:#eae1e6;--rose:#8b4f72;--deep:#56334c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#faf7f8,#f3e8ee);font:15px Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}.card{width:min(430px,100%);background:#fff;border:1px solid #eee3e9;border-radius:22px;padding:clamp(26px,7vw,42px);box-shadow:0 22px 70px #42293a12}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--deep);color:white;font:italic 30px Georgia;margin-bottom:24px}.eyebrow{color:var(--rose);font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase}.title{font:500 32px Georgia,serif;margin:8px 0}.desc{color:var(--soft);line-height:1.55;margin:0 0 26px}.field{display:grid;gap:8px;margin:16px 0}.field label{font-size:12px;font-weight:750;color:#62535e}.field input{height:48px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font:inherit;outline:0}.field input:focus{border-color:#ad7892;box-shadow:0 0 0 3px #f7e5ee}button{margin-top:8px;width:100%;height:48px;border:0;border-radius:11px;background:var(--deep);color:#fff;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;color:#ba4a5b;font-size:13px;margin-top:14px}.foot{text-align:center;color:#a89ba4;font-size:11px;margin-top:26px}</style></head><body><main class="card"><div class="mark">A</div><div class="eyebrow">Studio Arabesque</div><h1 class="title">Seu financeiro</h1><p class="desc">Entre para acompanhar alunas, recebimentos e despesas do espetáculo.</p><form id="loginForm"><div class="field"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">Entrar no financeiro</button><div class="error" id="error" role="alert"></div></form><div class="foot">Acesso privado · Fluent LevelUp</div></main><script>document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.currentTarget.querySelector("button"),err=document.querySelector("#error");b.disabled=true;b.textContent="Entrando…";err.textContent="";try{const response=await fetch("/api/finance/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});const data=await response.json();if(!response.ok)throw Error(data.message||"Não foi possível entrar.");location.replace("/finance/")}catch(x){err.textContent=x.message||"Não foi possível entrar."}finally{b.disabled=false;b.textContent="Entrar no financeiro"}})</script></body></html>
