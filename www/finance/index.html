async function financeAssistantSend(message,audioMode='text'){const clean=String(message||'').trim();if(!clean)return;const status=$('#financeAiStatus'),form=$('#financeChatForm'),history=assistantConversation.slice(-8);if(audioMode==='text'){addFinanceChatBubble(clean,'user');assistantConversation.push({role:'user',content:clean})}if(status)status.textContent=audioMode==='voice'?'Transcrevendo e entendendo sua fala…':'Consultando sua base…';if(form)form.querySelector('[type="submit"]').disabled=true;try{const payload={message:clean,history};if(audioMode==='voice'){payload.audioBase64=clean;payload.audioMime=voiceRecorder?.mimeType||'audio/webm'}const response=await fetch('/api/finance/assistant/understand',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.message||'Não consegui entender agora.');if(result.transcription){addFinanceChatBubble('Ouvi: “'+result.transcription+'”','user');assistantConversation.push({role:'user',content:result.transcription})}const answer=result.answer||'Entendi.';addFinanceChatBubble(answer);assistantConversation.push({role:'assistant',content:answer});assistantConversation=assistantConversation.slice(-8);assistantPending=Array.isArray(result.actions)&&result.actions.length?result.actions:null;drawFinanceProposal(assistantPending);if(status)status.textContent='';if(form&&audioMode==='text')form.elements.message.value=''}catch(error){if(status)status.textContent=error.message||'Falha ao conversar com a IA.'}finally{if(form)form.querySelector('[type="submit"]').disabled=false}}

async function confirmFinanceProposal(){if(!assistantPending?.length)return;const button=$('#financeConfirmProposal'),status=$('#financeAiStatus');if(button)button.disabled=true;if(status)status.textContent='Salvando as alterações confirmadas…';try{const response=await fetch('/api/finance/assistant/confirm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({actions:assistantPending})});const result=await response.json();if(!response.ok)throw Error(result.message||'Não foi possível confirmar.');state=normalizeState(result.data);assistantPending=null;drawFinanceProposal(null);render();addFinanceChatBubble(result.message||'Pronto, atualizei o financeiro.');if(status)status.textContent='Alterações salvas no servidor.'}catch(error){if(status)status.textContent=error.message||'Não foi possível confirmar.';if(button)button.disabled=false}}
async function toggleFinanceVoice(){const button=$('#financeVoiceButton'),status=$('#financeAiStatus');if(!button)return;if(voiceRecorder?.state==='recording'){voiceRecorder.stop();button.disabled=true;if(status)status.textContent='Enviando áudio com segurança…';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];voiceRecorder=new MediaRecorder(stream);voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};voiceRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());button.classList.remove('recording');button.innerHTML=I('mic');button.setAttribute('aria-label','Gravar instrução por voz');button.title='Gravar instrução por voz';button.disabled=false;const blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'});if(!blob.size){if(status)status.textContent='Não captei áudio. Tente novamente.';return}if(blob.size>10*1024*1024){if(status)status.textContent='A gravação passou de 10 MB. Faça uma instrução mais curta.';return}const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)});await financeAssistantSend(encoded,'voice')};voiceRecorder.start();button.classList.add('recording');button.innerHTML=I('arrow');button.setAttribute('aria-label','Enviar áudio');button.title='Enviar áudio';if(status)status.textContent='Gravando… toque no botão para enviar.'}catch(error){if(status)status.textContent='Não consegui acessar o microfone. Verifique a permissão do navegador.'}}

function totals(){const received=sum(state.payments,x=>x.amount),fees=sum(state.payments,x=>x.fee),expenses=sum(state.expenses,x=>x.amount)+sum(state.billPayments,x=>x.amount),receivable=sum(state.students,x=>remaining(x.amount,studentPaid(x.id))),payable=sum(state.bills,x=>remaining(x.amount,billPaid(x.id))),pendingCard=sum(state.payments.filter(p=>hasCard(p.method)&&p.payoutStatus!=='settled'),p=>N(p.amount)-N(p.fee));return{received,spent:expenses+fees,fees,expenses,receivable,payable,pendingCard,balance:received-expenses-fees}}

async function cachePaymentMethodBackgrounds(){
  try{const saved=JSON.parse(localStorage.getItem(PAYMENT_BACKGROUND_CACHE_KEY)||'{}');if(saved&&saved.version===1&&saved.images&&typeof saved.images==='object')paymentBackgroundCache=Object.fromEntries(Object.entries(saved.images).filter(([file,url])=>Object.values(PAYMENT_METHOD_BACKGROUND_FILES).includes(file)&&typeof url==='string'&&url.startsWith('data:image/')))}catch{}
  const missing=Object.values(PAYMENT_METHOD_BACKGROUND_FILES).filter(file=>!paymentBackgroundCache[file]);if(!missing.length){if(section==='methods'&&!$('#modalRoot .drawer'))render();return}
  const loaded=await Promise.allSettled(missing.map(async file=>{const response=await fetch(`/finance/assets/methods/${file}`,{credentials:'same-origin',cache:'force-cache'});if(!response.ok)throw Error(`HTTP ${response.status}`);const blob=await response.blob();return [file,await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||Error('Falha ao ler imagem'));reader.readAsDataURL(blob)})]}));
  const images={...paymentBackgroundCache};for(const result of loaded)if(result.status==='fulfilled')images[result.value[0]]=result.value[1];if(Object.keys(images).length===Object.values(PAYMENT_METHOD_BACKGROUND_FILES).length){try{const cache=JSON.stringify({version:1,images});if(cache.length<=3500000){localStorage.setItem(PAYMENT_BACKGROUND_CACHE_KEY,cache);paymentBackgroundCache=images;if(section==='methods'&&!$('#modalRoot .drawer'))render()}}catch{/* O cache do navegador é opcional; os caminhos de rede continuam disponíveis. */}}
}
