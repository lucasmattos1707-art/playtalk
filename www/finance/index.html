/* v2 — Mobile-first layout fixes and contextual student actions */
html,body{max-width:100%;overflow-x:clip}
.app,#view,.main,.panel,.section-head,.toolbar,.record-copy,.method-card,.bill-card{min-width:0}
.main{width:100%}
.top-actions{min-width:0}
.search-wrap{min-width:0}
.search-wrap input{min-width:0}
.section-head{flex-wrap:wrap}
.section-head h2,.section-head p{overflow-wrap:anywhere}
.record-right{min-width:0;max-width:48%}
.record-right b{white-space:normal;overflow-wrap:anywhere}
.mini b,.stat-value,.method-line strong{overflow-wrap:anywhere}
.method-line strong{text-align:right}
.bill-bottom{flex-wrap:wrap}
.toolbar-actions{min-width:0}
.container-filter{max-width:100%;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.pill-filter{flex-shrink:0}
.mic-trigger{color:var(--deep)!important;border-color:#dbc5d2!important;background:var(--rosewash)!important}
.mic-trigger:hover{background:#eedbe5!important}
.quick-separator{height:1px;background:var(--line);margin:7px 4px}
.student-list{background:#fff;border:1px solid var(--line);border-radius:17px;padding:6px 18px;box-shadow:var(--shadow)}
.student-item{padding:16px 0 17px;border-bottom:1px solid #f1eaf0;min-width:0}
.student-item:last-child{border-bottom:0}
.student-item-row{display:flex;align-items:center;gap:10px;min-width:0;margin-bottom:12px}
.student-name{appearance:none;border:0;background:none;color:var(--ink);padding:4px 0;text-align:left;min-width:0;flex:1;font-size:15px;line-height:1.45;font-weight:750;overflow-wrap:anywhere}
.student-name:hover{color:var(--rose)}
.student-kebab{flex-shrink:0;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid transparent;color:#786877;border-radius:11px}
.student-kebab:hover,.student-kebab[aria-expanded="true"]{background:var(--rosewash);color:var(--deep);border-color:#efdeea}
.student-kebab svg{width:21px;height:21px}
.student-progress{height:10px;width:100%;background:#e8ede9;border-radius:999px;overflow:hidden}
.student-progress-fill{height:100%;display:block;background:linear-gradient(90deg,#38a675,#217b56);border-radius:inherit;transition:width .25s ease}
.student-popover{position:fixed;z-index:44;width:228px;background:#fff;border:1px solid #eadfe5;border-radius:14px;box-shadow:0 18px 55px #3b25374a;padding:7px;max-width:calc(100vw - 20px)}
.student-popover-title{font-size:11px;font-weight:750;color:var(--soft);padding:8px 11px;border-bottom:1px solid var(--line);margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.student-popover button{width:100%;border:0;background:#fff;display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:9px;text-align:left;font-weight:650;color:var(--ink)}
.student-popover button:hover,.student-popover button:focus-visible{background:var(--rosewash);outline:none}
.student-popover button svg{height:17px;width:17px;color:var(--rose)}
.student-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.student-detail-head .circle{width:53px;height:53px}
.student-detail-head h3{font-size:19px;margin:0 0 9px;overflow-wrap:anywhere}
.detail-progress{background:#faf8f9;border:1px solid var(--line);padding:16px;border-radius:12px}
.detail-money{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--soft);flex-wrap:wrap}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.detail-field{background:#faf8f9;border:1px solid #f0e8ec;padding:13px;border-radius:10px;overflow-wrap:anywhere;min-width:0}
.detail-field small{display:block;color:var(--soft);font-size:11px;margin-bottom:7px}
.detail-field strong{display:block;font-size:13px}
.ai-placeholder{text-align:center;padding:30px 12px;line-height:1.6}
.ai-placeholder>svg{width:54px;height:54px;color:var(--rose);padding:12px;background:var(--rosewash);border-radius:18px}
.ai-placeholder h3{font-family:Georgia,serif;font-size:24px;font-weight:500}
.ai-placeholder p{max-width:340px;margin:14px auto}
@media(max-width:900px){
 .main{padding-left:16px;padding-right:16px}
 .container-filter{width:100%}
 .mobile-nav{width:100%;max-width:100vw}
}
@media(max-width:760px){
 .container-filter{flex-wrap:wrap;overflow:visible}
 .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat{padding:13px;min-height:114px}
 .stat-value{font-size:clamp(16px,4.6vw,23px);letter-spacing:-.7px}
 .stat-head{font-size:11px;align-items:start}
 .top-actions{width:100%;flex-wrap:nowrap;gap:7px}
 .top-actions .quick-position{flex-shrink:0}
 .search-wrap{flex:1}
 .search-wrap input{width:100%}
 .panel{overflow:hidden}
 .mini-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}

<script>
'use strict';
/* ================== FINANCEIRO STUDIO ARABESQUE — LOCAL V1 ================== */
const ICON={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',students:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',expenses:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',bills:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3M8 18h7"/>',methods:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.7" cy="10.7" r="7"/><path d="m16 16 5 5"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-5 5 5-5 5 5M4 7V3h16v4"/>',money:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',up:'<path d="m3 17 6-6 4 4 8-8M15 7h6v6"/>',down:'<path d="m3 7 6 6 4-4 8 8M15 17h6v-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m4 12 5 5L20 6"/>',edit:'<path d="M12 20h9M16.7 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',alert:'<path d="M12 9v4M12 17h.01"/><path d="m10.3 4-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>',trend:'<path d="m2 17 6-6 4 4 10-10M16 5h6v6"/>',spark:'<path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6L12 2z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
ICON.mic='<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/>';
ICON.dots='<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>';
const I=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||ICON.file}</svg>`;
const MODES=['Pix','Cartão de crédito','Cartão de débito','Boleto','Dinheiro','Transferência'];
const CATEGORIES=['Figurinos','Costureira','Som e iluminação','Painel de LED','Ginásio','Decoração','Impressões','Kits e brindes','Equipe','Taxas','Outros'];
const NAV=[['dashboard','Resumo','dashboard'],['students','Alunas','students'],['expenses','Despesas','expenses'],['bills','Contas a pagar','bills'],['methods','Formas de pagamento','methods']];
const DEFAULT={version:1,students:[],payments:[],expenses:[],bills:[],billPayments:[]};
let state=structuredClone(DEFAULT),section='dashboard',search='',statusFilter='Todos',db=null,usingFallback=false,saveChain=Promise.resolve(),saveTimer=null,assistantPending=null,voiceRecorder=null,voiceChunks=[];
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`id_${Date.now()}_${Math.random().toString(36).slice(2)}`;
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const N=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?Math.round(x*100)/100:0};
const sum=(arr,get=x=>x)=>arr.reduce((a,x)=>a+N(get(x)),0);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const displayDate=s=>{if(!s)return 'Não definido';const [y,m,d]=s.split('-');return d&&m&&y?`${d}/${m}/${y}`:s};
const dateKey=(dt)=>String(dt||'').slice(0,7);
const matches=(...values)=>!search||values.some(x=>String(x??'').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')));
const titleCase=s=>String(s||'').trim().replace(/\s+/g,' ');
const hasCard=s=>String(s||'').startsWith('Cartão');
function safeUrl(s){try{const u=new URL(String(s||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
const findStudent=key=>state.students.find(x=>x.id===key);
const findBill=key=>state.bills.find(x=>x.id===key);
const studentPaid=id=>sum(state.payments.filter(x=>x.studentId===id),x=>x.amount);
const billPaid=id=>sum(state.billPayments.filter(x=>x.billId===id),x=>x.amount);
const remaining=(v,p)=>Math.max(0,Math.round((N(v)-p)*100)/100);
function studentStatus(s){const rem=remaining(s.amount,studentPaid(s.id));if(!N(s.amount))return ['Sem cobrança','nocharge'];if(rem<=0)return ['Pago','paid'];if(s.dueDate&&s.dueDate<today())return ['Atrasado','late'];return studentPaid(s.id)>0?['Parcial','partial']:['Pendente','pending']}
function billStatus(b){const rem=remaining(b.amount,billPaid(b.id));if(rem<=0)return ['Pago','paid'];if(b.dueDate&&b.dueDate<today())return ['Vencido','late'];return billPaid(b.id)>0?['Parcial','partial']:['Pendente','pending']}
const badge=(name,type)=>`<span class="tag ${type}">${esc(name)}</span>`;
const attButton=(fileId)=>fileId?`<button class="mini-action" type="button" data-action="attachment" data-id="${esc(fileId)}" title="Abrir comprovante" aria-label="Abrir comprovante">${I('file')}</button>`:'';
const empty=(heading,desc,icon='layers')=>`<div class="empty">${I(icon)}<strong>${esc(heading)}</strong>${esc(desc)}</div>`;
function normalizeState(s){if(!s||!Array.isArray(s.students)||!Array.isArray(s.payments)||!Array.isArray(s.expenses)||!Array.isArray(s.bills)||!Array.isArray(s.billPayments))throw Error('Arquivo não é um backup compatível.');const copy={version:1};for(const k of ['students','payments','expenses','bills','billPayments'])copy[k]=s[k].filter(x=>x&&typeof x==='object'&&!Array.isArray(x)).map(x=>({...x,id:String(x.id||id())}));return copy}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('arabesque_local_financeiro',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('data'))d.createObjectStore('data');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbGet(store,key){return new Promise((resolve,reject)=>{const req=db.transaction(store,'readonly').objectStore(store).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbPut(store,key,value){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function dbRemove(store,key){if(!db)return Promise.resolve();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function dbFiles(){return new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
function dbClearFiles(){return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function initStorage(){try{db=await openDB();const response=await fetch('/api/finance/data',{credentials:'same-origin',cache:'no-store'});if(response.status===401){window.location.replace('/finance/login');return}const payload=await response.json();if(!response.ok)throw Error(payload.message||'Não foi possível carregar o financeiro.');state=normalizeState(payload.data||DEFAULT)}catch(e){console.error('Falha ao carregar dados do servidor.',e);toast(e.message||'Não foi possível carregar os dados do servidor.',true);throw e}}
function persist(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(()=>flush().catch(()=>{}),120)}
function flush(){clearTimeout(saveTimer);saveTimer=null;const snap=structuredClone(state);saveChain=saveChain.catch(()=>{}).then(async()=>{const response=await fetch('/api/finance/data',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:snap})});const payload=await response.json().catch(()=>({}));if(response.status===401){window.location.replace('/finance/login');throw Error('Sua sessão expirou. Entre novamente.')}if(!response.ok)throw Error(payload.message||'Não foi possível salvar no servidor.')});return saveChain.catch(err=>{console.error(err);toast(err.message||'Não foi possível salvar no servidor.',true);throw err})}
function commit(){persist();render()}
async function uploadFromForm(form,prevId){const file=form.elements.attachment?.files?.[0];if(!file)return prevId||'';if(!db)throw Error('Este navegador está sem armazenamento de anexos. Remova o arquivo e tente novamente.');if(file.size>8*1024*1024)throw Error('Cada comprovante pode ter até 8 MB.');const fid=id();await dbPut('files',fid,{id:fid,name:file.name,type:file.type,blob:file});return fid}
async function deleteFileIfUnused(fid){if(!fid||!db)return;const all=[...state.payments,...state.expenses,...state.billPayments,...state.bills];if(all.some(x=>x.fileId===fid))return;await dbRemove('files',fid).catch(console.warn)}
async function viewAttachment(fid){if(!db){toast('Comprovantes indisponíveis neste navegador.',true);return}try{const f=await dbGet('files',fid);if(!f){toast('Comprovante não encontrado.',true);return}const u=URL.createObjectURL(f.blob);const link=document.createElement('a');link.href=u;link.download=f.name||'comprovante';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch(e){toast('Erro ao abrir comprovante.',true)}}

async function financeLogout(){await fetch('/api/finance/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});window.location.assign('/finance/login')}
function addFinanceChatBubble(text,role='assistant'){const box=$('#financeChatMessages');if(!box)return;const bubble=document.createElement('div');bubble.className='ai-bubble '+(role==='user'?'user':role==='system'?'system':'');bubble.textContent=String(text||'');box.appendChild(bubble);box.scrollTop=box.scrollHeight}
async function financeAssistantSend(message,audioMode='text'){const clean=String(message||'').trim();if(!clean)return;const status=$('#financeAiStatus'),form=$('#financeChatForm');if(audioMode==='text')addFinanceChatBubble(clean,'user');if(status)status.textContent=audioMode==='voice'?'Transcrevendo e entendendo sua fala…':'Consultando sua base…';if(form)form.querySelector('[type="submit"]').disabled=true;try{const payload={message:clean};if(audioMode==='voice'){payload.audioBase64=clean;payload.audioMime=voiceRecorder?.mimeType||'audio/webm'}const response=await fetch('/api/finance/assistant/understand',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.message||'Não consegui entender agora.');if(result.transcription)addFinanceChatBubble('Ouvi: “'+result.transcription+'”','user');addFinanceChatBubble(result.answer||'Entendi.');assistantPending=Array.isArray(result.actions)&&result.actions.length?result.actions:null;drawFinanceProposal(assistantPending);if(status)status.textContent='';if(form&&audioMode==='text')form.elements.message.value=''}catch(error){if(status)status.textContent=error.message||'Falha ao conversar com a IA.'}finally{if(form)form.querySelector('[type="submit"]').disabled=false}}
function drawFinanceProposal(actions){const root=$('#financeProposal');if(!root)return;if(!actions?.length){root.innerHTML='';return}const labels={add_student:'Adicionar aluna',add_expense:'Registrar despesa',update_expense:'Editar despesa',delete_expense:'Excluir despesa',add_payment:'Registrar recebimento'};root.innerHTML='<div class="ai-proposal"><strong>Proposta para confirmar</strong><ul>'+actions.map(a=>'<li>'+esc(labels[a.type]||'Atualização')+': '+esc(a.summary||a.name||a.title||a.id||'ver detalhes')+(a.amount!=null?' · '+fmt(a.amount):'')+'</li>').join('')+'</ul><button class="btn ai-confirm" id="financeConfirmProposal" type="button">'+I('check')+' Confirmar movimentações</button></div>'}
async function confirmFinanceProposal(){if(!assistantPending?.length)return;const button=$('#financeConfirmProposal'),status=$('#financeAiStatus');if(button)button.disabled=true;if(status)status.textContent='Salvando as alterações confirmadas…';try{const response=await fetch('/api/finance/assistant/confirm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({actions:assistantPending})});const result=await response.json();if(!response.ok)throw Error(result.message||'Não foi possível confirmar.');state=normalizeState(result.data);assistantPending=null;drawFinanceProposal(null);render();addFinanceChatBubble(result.message||'Pronto, atualizei o financeiro.');if(status)status.textContent='Alterações salvas no servidor.'}catch(error){if(status)status.textContent=error.message||'Não foi possível confirmar.';if(button)button.disabled=false}}
async function toggleFinanceVoice(){const button=$('#financeVoiceButton'),status=$('#financeAiStatus');if(!button)return;if(voiceRecorder?.state==='recording'){voiceRecorder.stop();button.disabled=true;if(status)status.textContent='Enviando áudio com segurança…';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];voiceRecorder=new MediaRecorder(stream);voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};voiceRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());button.classList.remove('recording');button.innerHTML=I('mic')+' <span>Voz</span>';button.disabled=false;const blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'});if(!blob.size){if(status)status.textContent='Não captei áudio. Tente novamente.';return}if(blob.size>10*1024*1024){if(status)status.textContent='A gravação passou de 10 MB. Faça uma instrução mais curta.';return}const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)});await financeAssistantSend(encoded,'voice')};voiceRecorder.start();button.classList.add('recording');button.innerHTML=I('close')+' <span>Parar</span>';if(status)status.textContent='Gravando… toque em Parar para enviar.'}catch(error){if(status)status.textContent='Não consegui acessar o microfone. Verifique a permissão do navegador.'}}

function toast(msg,error=false){$('#toastRoot').innerHTML=`<div class="toast ${error?'error':''}" role="status">${esc(msg)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>$('#toastRoot').innerHTML='',3900)}
function goto(sec){section=sec;search='';statusFilter='Todos';$('#searchInput').value='';$('#quickMenu').classList.add('hidden');closeStudentMenu();render();window.scrollTo({top:0,behavior:'instant'})}
function renderNav(){const nav=([key,name,ic])=>`<button class="nav-btn ${section===key?'active':''}" data-action="nav" data-section="${key}" type="button">${I(ic)} ${name}</button>`;$('#desktopNav').innerHTML=NAV.map(nav).join('');$('#mobileNav').innerHTML=NAV.map(([key,name,ic])=>`<button type="button" class="${section===key?'active':''}" data-action="nav" data-section="${key}">${I(ic)}<span>${name==='Formas de pagamento'?'Métodos':name==='Contas a pagar'?'Contas':name}</span></button>`).join('')}
function totals(){const received=sum(state.payments,x=>x.amount),fees=sum(state.payments,x=>x.fee),expenses=sum(state.expenses,x=>x.amount)+sum(state.billPayments,x=>x.amount),receivable=sum(state.students,x=>remaining(x.amount,studentPaid(x.id))),payable=sum(state.bills,x=>remaining(x.amount,billPaid(x.id))),pendingCard=sum(state.payments.filter(p=>hasCard(p.method)&&p.payoutStatus!=='settled'),p=>N(p.amount)-N(p.fee));return{received,spent:expenses+fees,fees,expenses,receivable,payable,pendingCard,balance:received-expenses-fees}}
function metric(name,value,type,icon,foot=''){return `<article class="stat ${type}"><div class="stat-head"><span>${name}</span><span class="stat-icon">${I(icon)}</span></div><div class="stat-value">${fmt(value)}</div><div class="stat-foot">${foot}</div></article>`}
function chart(){const keys=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`});const rows=keys.map(k=>({k,label:new Date(Number(k.slice(0,4)),Number(k.slice(5))-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),ins:sum(state.payments.filter(x=>dateKey(x.date)===k),x=>x.amount),outs:sum(state.expenses.filter(x=>dateKey(x.date)===k),x=>x.amount)+sum(state.billPayments.filter(x=>dateKey(x.date)===k),x=>x.amount)+sum(state.payments.filter(x=>dateKey(x.date)===k),x=>x.fee)}));const max=Math.max(1,...rows.flatMap(r=>[r.ins,r.outs]));return `<div class="panel"><div class="panel-heading"><div><h3>Entradas e saídas</h3><div class="panel-sub">Últimos seis meses • por data do lançamento</div></div></div><div class="legend"><span><i style="background:#b97d9c"></i> Recebimentos</span><span><i style="background:#dfc5d3"></i> Despesas + taxas</span></div><div class="chart-wrap">${rows.map(r=>`<div class="chart-col"><div class="chart-bar" data-label="${fmt(r.ins)}" style="height:${Math.max(r.ins?2:0,r.ins/max*100)}%"></div><div class="chart-bar out" data-label="${fmt(r.outs)}" style="height:${Math.max(r.outs?2:0,r.outs/max*100)}%"></div></div>`).join('')}</div><div class="chart-months">${rows.map(r=>`<span>${r.label}</span>`).join('')}</div></div>`}
function dashboard(){const t=totals();const overdue=state.bills.filter(b=>billStatus(b)[1]==='late').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));const upcoming=state.bills.filter(b=>remaining(b.amount,billPaid(b.id))>0).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0,5);const activity=[...state.payments.map(p=>({label:findStudent(p.studentId)?.name||'Aluna removida',date:p.date,method:p.method,value:p.amount,type:'in'})),...state.expenses.map(e=>({label:e.title,date:e.date,method:e.method,value:e.amount,type:'out'})),...state.billPayments.map(p=>({label:findBill(p.billId)?.title||'Conta',date:p.date,method:p.method,value:p.amount,type:'out'}))].filter(x=>matches(x.label,x.method)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);return `<div class="hero"><div><div class="eyebrow" style="color:#f1c7d9">Bem-vinda ao seu painel</div><h2>Seu espetáculo, suas contas em ordem.</h2><p>Cadastre alunas, acompanhe pagamentos e controle cada despesa em um só lugar.</p></div><button class="btn" type="button" data-action="modal" data-kind="bulk">${I('plus')} Adicionar alunas</button></div><div class="stat-grid">${metric('Total recebido',t.received,'green','down','Pagamentos registrados das alunas')}${metric('Total gasto',t.spent,'red','up','Despesas pagas + taxas de cartão')}${metric('A receber',t.receivable,'amber','clock','Saldo das cobranças das alunas')}${metric('Contas a pagar',t.payable,'red','bills','Obrigações ainda não quitadas')}</div><div class="section-head"><h2>Panorama financeiro</h2></div><div class="mini-metrics" style="margin-bottom:17px"><div class="mini"><span>Resultado registrado</span><b style="color:${t.balance<0?'var(--red)':'var(--green)'}">${fmt(t.balance)}</b></div><div class="mini"><span>Cartão a repassar (líquido)</span><b>${fmt(t.pendingCard)}</b></div><div class="mini"><span>Contas vencidas</span><b>${overdue.length}</b></div></div><div class="grid-2">${chart()}<div class="panel"><div class="panel-heading"><div><h3>Próximos vencimentos</h3><div class="panel-sub">Contas em aberto, ordenadas por data</div></div><button class="btn ghost small" data-action="nav" data-section="bills">Ver todas ${I('arrow')}</button></div>${upcoming.length?`<div class="rows">${upcoming.map(b=>`<div class="record"><span class="circle">${I('clock')}</span><div class="record-copy"><div class="record-title">${esc(b.title)}</div><div class="record-meta">${esc(b.supplier||'Sem fornecedor')} · ${displayDate(b.dueDate)}</div></div><div class="record-right"><b>${fmt(remaining(b.amount,billPaid(b.id)))}</b>${badge(...billStatus(b))}</div></div>`).join('')}</div>`:empty('Nenhuma conta pendente','Os próximos vencimentos aparecerão aqui.','check')}</div></div><div class="section-head"><h2>Movimentações recentes</h2></div><div class="panel">${activity.length?`<div class="rows">${activity.map(x=>`<div class="record"><span class="circle" style="background:${x.type==='in'?'#e8f6ee':'#faedf2'};color:${x.type==='in'?'var(--green)':'var(--red)'}">${I(x.type==='in'?'down':'up')}</span><div class="record-copy"><div class="record-title">${esc(x.label)}</div><div class="record-meta">${displayDate(x.date)} · ${esc(x.method)}</div></div><div class="record-right"><b class="${x.type==='in'?'money-pos':'money-neg'}">${x.type==='in'?'+':'−'} ${fmt(x.value)}</b></div></div>`).join('')}</div>`:empty('Sem movimentações','Registre o primeiro recebimento ou despesa para começar.')}</div><div class="helper-line">Resultado registrado = pagamentos das alunas − despesas pagas − taxas de cartão. Valores de cartão ainda não repassados pela operadora estão incluídos no resultado, mas destacados à parte.</div>`}
function studentsView(){
  const arr=state.students.filter(s=>matches(s.name,s.guardian,s.notes))
    .filter(s=>statusFilter==='Todos'||studentStatus(s)[0]===statusFilter)
    .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const paid=state.students.filter(s=>studentStatus(s)[1]==='paid').length;
  return `<div class="section-head"><div><h2>Alunas do espetáculo</h2><p>${state.students.length} cadastrada(s) • ${paid} quitada(s)</p></div></div>
  <div class="toolbar"><div class="container-filter">${['Todos','Pago','Parcial','Pendente','Atrasado'].map(x=>`<button type="button" data-action="filter" data-status="${x}" class="pill-filter ${statusFilter===x?'selected':''}">${x}</button>`).join('')}</div>
  <div class="toolbar-actions"><button type="button" class="btn light" data-action="modal" data-kind="bulk">${I('students')} Adicionar em massa</button><button type="button" class="btn primary" data-action="modal" data-kind="student">${I('plus')} Nova aluna</button></div></div>
  <section class="student-list" aria-label="Lista de alunas">${arr.map(s=>{
    const paid=studentPaid(s.id),total=N(s.amount),pct=total>0?Math.min(100,Math.max(0,Math.round(paid/total*100))):0;
    return `<article class="student-item"><div class="student-item-row"><button type="button" class="student-name" data-action="modal" data-kind="studentView" data-id="${esc(s.id)}" title="Visualizar informações de ${esc(s.name)}">${esc(s.name)}</button>
    <button class="student-kebab" type="button" data-action="studentMenu" data-id="${esc(s.id)}" aria-label="Opções de ${esc(s.name)}" aria-haspopup="menu" aria-expanded="false">${I('dots')}</button></div>
    <div class="student-progress" role="progressbar" aria-label="Pagamento de ${esc(s.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" title="${pct}% da cobrança recebida"><span class="student-progress-fill" style="width:${pct}%"></span></div></article>`;
  }).join('')}${!arr.length?empty('Nenhuma aluna encontrada','Adicione nomes em massa ou altere sua pesquisa.','students'):''}</section>
  <p class="helper-line">A barra verde representa o percentual pago. Use os três pontinhos ao lado do nome para visualizar, editar ou acrescentar valores.</p>`;
}

function closeStudentMenu(){const m=$('#studentMenu');if(!m)return;m.classList.add('hidden');m.innerHTML='';document.querySelectorAll('.student-kebab[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function toggleStudentMenu(sid,button){
  const menu=$('#studentMenu'),current=menu.dataset.for;
  if(!menu.classList.contains('hidden')&&current===sid){closeStudentMenu();return}
  const s=findStudent(sid);if(!s)return;
  document.querySelectorAll('.student-kebab[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
  menu.dataset.for=sid;
  menu.innerHTML=`<div class="student-popover-title" title="${esc(s.name)}">${esc(s.name)}</div>
    <button role="menuitem" type="button" data-action="modal" data-kind="studentView" data-id="${esc(sid)}">${I('file')} Visualizar</button>
    <button role="menuitem" type="button" data-action="modal" data-kind="student" data-id="${esc(sid)}">${I('edit')} Editar</button>
    <button role="menuitem" type="button" data-action="modal" data-kind="studentCharge" data-id="${esc(sid)}">${I('plus')} Adicionar valores</button>`;
  menu.classList.remove('hidden');button.setAttribute('aria-expanded','true');
  const rect=button.getBoundingClientRect(),mw=228,mh=menu.getBoundingClientRect().height;
  const left=Math.max(10,Math.min(window.innerWidth-mw-10,rect.right-mw));
  const top=rect.bottom+6+mh>window.innerHeight-12?Math.max(10,rect.top-mh-6):rect.bottom+6;
  menu.style.left=left+'px';menu.style.top=top+'px';
  menu.querySelector('button')?.focus({preventScroll:true});
}
function decorateTables(){
  document.querySelectorAll('#view .data-table').forEach(table=>{
    const headings=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    table.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{
      td.dataset.label=headings[i]||'';
      if(i===headings.length-1)td.classList.add('mobile-table-actions');
    }));
  });
}

function allExpenses(){return [...state.expenses.map(e=>({...e,origin:'expense',source:'Despesa direta'})),...state.billPayments.map(p=>({...p,title:findBill(p.billId)?.title||'Conta removida',supplier:findBill(p.billId)?.supplier||'',category:findBill(p.billId)?.category||'Outros',origin:'billPayment',source:'Conta a pagar'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function expensesView(){const list=allExpenses().filter(e=>matches(e.title,e.supplier,e.category,e.method,e.notes));return `<div class="section-head"><div><h2>Gastos realizados</h2><p>Despesas avulsas e pagamentos de contas, sem duplicações.</p></div><button class="btn primary" data-action="modal" data-kind="expense">${I('plus')} Nova despesa</button></div><div class="stat-grid" style="margin-bottom:22px">${metric('Despesas diretas',sum(state.expenses,x=>x.amount),'red','expenses')}${metric('Contas já pagas',sum(state.billPayments,x=>x.amount),'red','bills')}${metric('Taxas de cartões',sum(state.payments,x=>x.fee),'amber','money')}${metric('Total gasto',totals().spent,'red','up')}</div><div class="table-scroll"><table class="data-table"><thead><tr><th>Despesa / fornecedor</th><th>Categoria</th><th>Valor</th><th>Pagamento</th><th>Data</th><th>Origem</th><th style="text-align:right">Ações</th></tr></thead><tbody>${list.map(e=>`<tr><td><div class="cell-primary">${esc(e.title)}</div><div class="cell-secondary">${esc(e.supplier||'Não informado')}</div></td><td>${esc(e.category||'Outros')}</td><td class="money-neg">${fmt(e.amount)}</td><td>${esc(e.method||'—')}</td><td>${displayDate(e.date)}</td><td>${badge(e.source,'pending')}</td><td><div class="actions-cell">${attButton(e.fileId)}<button class="mini-action" data-action="modal" data-kind="${e.origin}" data-id="${e.id}" title="Editar" type="button">${I('edit')}</button><button class="mini-action del" data-action="delete" data-type="${e.origin}" data-id="${e.id}" title="Excluir" type="button">${I('trash')}</button></div></td></tr>`).join('')}</tbody></table>${list.length?'':empty('Nenhuma despesa encontrada','Cadastre os custos do espetáculo para vê-los aqui.','expenses')}</div><div class="helper-line">Taxas de cartão são contabilizadas no total gasto, mas aparecem separadamente das despesas avulsas nesta tabela.</div>`}
function billsView(){const list=state.bills.filter(b=>matches(b.title,b.supplier,b.category,b.notes)).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));return `<div class="section-head"><div><h2>Compromissos e contas a pagar</h2><p>Controle o que ainda falta pagar, inclusive parcelas.</p></div><button class="btn primary" data-action="modal" data-kind="bill">${I('plus')} Nova conta</button></div><div class="bill-grid">${list.map(b=>{const p=billPaid(b.id),r=remaining(b.amount,p),percent=+b.amount?Math.min(100,p/N(b.amount)*100):100;const payments=state.billPayments.filter(x=>x.billId===b.id).sort((a,b)=>b.date.localeCompare(a.date));return `<article class="bill-card"><div class="bill-top"><div><div class="bill-name">${esc(b.title)}<small>${esc(b.supplier||'Fornecedor não informado')}</small></div></div>${badge(...billStatus(b))}</div><div class="bill-amount">${fmt(r)} <small class="muted" style="font-size:12px;font-weight:500">em aberto</small></div><div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div><div class="progress-labels"><span>${fmt(p)} pago</span><span>total ${fmt(b.amount)}</span></div><div class="record-meta" style="margin-top:12px">Vencimento: <strong>${displayDate(b.dueDate)}</strong> · ${esc(b.method||'Não definida')} ${b.partNumber?`· Parcela ${esc(b.partNumber)}${b.partTotal?'/'+esc(b.partTotal):''}`:''}</div><div class="bill-bottom"><div class="toolbar-actions"><button type="button" class="btn primary small" data-action="modal" data-kind="billPayment" data-bill="${b.id}" ${r<=0?'disabled':''}>${I('check')} Pagar</button><button type="button" class="btn light small" data-action="modal" data-kind="bill" data-id="${b.id}">${I('edit')} Editar</button><button type="button" class="mini-action del" data-action="delete" data-type="bill" data-id="${b.id}" title="Excluir conta">${I('trash')}</button></div>${b.link&&safeUrl(b.link)?`<a class="btn light small" href="${esc(safeUrl(b.link))}" target="_blank" rel="noopener noreferrer" title="Abrir boleto">${I('file')} Boleto</a>`:''}${attButton(b.fileId)}</div>${payments.length?`<details><summary>Histórico de pagamentos (${payments.length})</summary><div class="rows">${payments.map(x=>`<div class="record"><div class="record-copy"><div class="record-title">${fmt(x.amount)}</div><div class="record-meta">${displayDate(x.date)} · ${esc(x.method)}</div></div>${attButton(x.fileId)}<button type="button" class="mini-action" data-action="modal" data-kind="billPayment" data-id="${x.id}">${I('edit')}</button><button type="button" class="mini-action del" data-action="delete" data-type="billPayment" data-id="${x.id}">${I('trash')}</button></div>`).join('')}</div></details>`:''}</article>`}).join('')}</div>${list.length?'':empty('Nenhuma conta cadastrada','Registre seus pagamentos futuros, boletos e compromissos.','bills')}<div class="helper-line">Ao pagar uma conta, a movimentação entra automaticamente em “Gastos realizados”. Não é necessário lançá-la novamente como despesa.</div>`}
function methodsView(){const t=totals();const buckets=MODES.map(m=>({method:m,in:sum(state.payments.filter(p=>p.method===m),x=>x.amount),out:sum(state.expenses.filter(e=>e.method===m),x=>x.amount)+sum(state.billPayments.filter(p=>p.method===m),x=>x.amount),fee:sum(state.payments.filter(p=>p.method===m),x=>x.fee)}));const max=Math.max(1,...buckets.map(b=>b.in+b.out));return `<div class="section-head"><div><h2>Controle por forma de pagamento</h2><p>Tudo o que entrou e saiu, agrupado por método.</p></div></div><div class="mini-metrics" style="margin:0 0 18px"><div class="mini"><span>Recebimentos</span><b>${fmt(t.received)}</b></div><div class="mini"><span>Saídas + taxas</span><b>${fmt(t.spent)}</b></div><div class="mini"><span>Cartão pendente de repasse</span><b>${fmt(t.pendingCard)}</b></div></div><div class="method-grid">${buckets.map(b=>`<article class="method-card"><h3>${I('methods')}${esc(b.method)}</h3><div class="method-line"><span>Recebimentos</span><strong class="money-pos">${fmt(b.in)}</strong></div><div class="method-line"><span>Pagamentos</span><strong>${fmt(b.out)}</strong></div><div class="method-line"><span>Taxas</span><strong>${fmt(b.fee)}</strong></div><div class="method-line"><span>Resultado registrado</span><strong>${fmt(b.in-b.out-b.fee)}</strong></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(b.in+b.out)/max*100)}%"></div></div></article>`).join('')}</div><div class="section-head"><h2>Recebimentos das alunas</h2></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Aluna</th><th>Data</th><th>Forma</th><th>Valor</th><th>Taxa</th><th>Repasse</th><th style="text-align:right">Ações</th></tr></thead><tbody>${state.payments.filter(p=>matches(findStudent(p.studentId)?.name,p.method,p.notes)).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td class="cell-primary">${esc(findStudent(p.studentId)?.name||'Aluna removida')}</td><td>${displayDate(p.date)}</td><td>${esc(p.method)}</td><td class="money-pos">${fmt(p.amount)}</td><td>${fmt(p.fee)}</td><td>${hasCard(p.method)?badge(p.payoutStatus==='settled'?'Repassado':'A repassar',p.payoutStatus==='settled'?'paid':'partial'):'—'}</td><td><div class="actions-cell">${attButton(p.fileId)}<button type="button" class="mini-action" data-action="modal" data-kind="payment" data-id="${p.id}">${I('edit')}</button><button type="button" class="mini-action del" data-action="delete" data-type="payment" data-id="${p.id}">${I('trash')}</button></div></td></tr>`).join('')}</tbody></table>${!state.payments.length?empty('Ainda não há recebimentos','Registre um pagamento no cadastro das alunas.','money'):''}</div><div class="helper-line">Cartões: o valor bruto é considerado pago pela aluna; a taxa é registrada como custo, e o repasse pendente é destacado. “Resultado registrado” não representa, necessariamente, saldo disponível no banco.</div>`}
function render(){renderNav();$('#pageTitle').textContent=({dashboard:'Visão geral',students:'Alunas e recebimentos',expenses:'Despesas realizadas',bills:'Contas a pagar',methods:'Formas de pagamento'})[section];$('#view').innerHTML=({dashboard,students:studentsView,expenses:expensesView,bills:billsView,methods:methodsView})[section]();closeStudentMenu();decorateTables();}
function input(name,label,value='',type='text',required=false,other=''){return `<div class="field"><label for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${other}></div>`}
function full(html){return html.replace('<div class="field">','<div class="field full">')}
function select(name,label,items,value='',required=false){return `<div class="field"><label for="f_${name}">${label}${required?' *':''}</label><select name="${name}" id="f_${name}" ${required?'required':''}>${items.map(x=>`<option value="${esc(x.value??x)}" ${String(x.value??x)===String(value)?'selected':''}>${esc(x.label??x)}</option>`).join('')}</select></div>`}
function textarea(name,label,value='',placeholder='',rows=4){return `<div class="field full"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`}
function attachment(existing){return `<div class="field full"><label for="f_attachment">Comprovante ou nota fiscal (opcional)</label><input id="f_attachment" type="file" name="attachment" accept="image/*,.pdf,application/pdf"><small>Arquivo guardado neste dispositivo (até 8 MB). ${existing?'Já existe um anexo: selecionar outro substitui o atual.':''}${usingFallback?' Seu navegador não permite anexos neste modo.':''}</small></div>`}
const notes=x=>textarea('notes','Observações',x||'','Informações adicionais...');
function studentOpts(value){return state.students.map(s=>({value:s.id,label:s.name})).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'))}
function billOpts(){return state.bills.map(b=>({value:b.id,label:b.title})).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'))}
function methodOpts(){return MODES.map(x=>({value:x,label:x}))}
function drawModal(kind,ident,ref){let name='',body='',wide=false,submit='Salvar';const find=(key)=>state[key].find(x=>x.id===ident);const old=kind==='student'?find('students'):kind==='payment'?find('payments'):kind==='expense'?find('expenses'):kind==='bill'?find('bills'):kind==='billPayment'?find('billPayments'):null;
if(kind==='studentView'){
  const stu=findStudent(ident);if(!stu)return;
  name='Informações da aluna';
  const paid=studentPaid(stu.id),due=remaining(stu.amount,paid),percent=N(stu.amount)?Math.min(100,Math.round(paid/N(stu.amount)*100)):0;
  const ps=state.payments.filter(p=>p.studentId===stu.id).sort((a,b)=>b.date.localeCompare(a.date));
