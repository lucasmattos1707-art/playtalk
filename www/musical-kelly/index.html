<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Musical Kelly | Fluent LevelUp</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/musical-kelly/styles.css?v=14">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar" id="topbar" hidden>
    <div class="top-actions">
      <button class="icon-action" id="refreshButton" type="button" title="Atualizar o musical" aria-label="Atualizar containers, áudios e comentários">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6v5h-5M4 18v-5h5M18.5 10A7 7 0 0 0 6.2 7.2L4 11M5.5 14A7 7 0 0 0 17.8 16.8L20 13"/>
        </svg>
      </button>
      <button class="icon-action" id="downloadAllButton" type="button" title="Baixar todas as faixas para este aparelho" aria-label="Baixar todas as faixas">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/>
        </svg>
      </button>
      <button class="icon-action" id="sortButton" type="button" title="Alterar ordem dos containers" aria-label="Ativar modo de alterar ordem" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6h12M4 6h.01M8 12h12M4 12h.01M8 18h12M4 18h.01"/>
        </svg>
      </button>
      <button class="primary-action" id="addCardButton" type="button" aria-label="Adicionar novo container" title="Adicionar novo container" hidden>
        <span aria-hidden="true">+</span>
      </button>
    </div>
  </header>

  <aside class="new-audio-notice" id="newAudioNotice" role="status" aria-live="polite" hidden>
    <span class="new-audio-notice__dot" aria-hidden="true"></span>
    <span id="newAudioNoticeText"></span>
  </aside>

  <main>
    <section class="selection-panel" id="selectionPanel" hidden aria-label="Editar container selecionado">
      <div class="selection-copy">
        <span class="selection-dot" aria-hidden="true"></span>
        <label for="titleInput">Container selecionado</label>
      </div>
      <input id="titleInput" maxlength="120" autocomplete="off" aria-label="Nome da faixa">
      <div class="selection-actions">
        <button type="button" id="chooseAudioButton"><kbd>A</kbd> Música</button>
        <button type="button" id="chooseImageButton"><kbd>P</kbd> Imagem</button>
        <button type="button" class="danger-action" id="removeCardButton" title="Remover container">Remover</button>
      </div>
      <button class="close-selection" id="closeSelectionButton" type="button" aria-label="Fechar edição" title="Fechar edição">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </section>

    <div class="status-line" id="statusLine" role="status" aria-live="polite">
      <span class="status-pulse" aria-hidden="true"></span>
      <span id="statusText">Carregando o musical…</span>
    </div>

    <section class="track-list" id="trackList" aria-label="Faixas do musical"></section>
  </main>

  <template id="trackTemplate">
    <article class="track-card" tabindex="0">
      <div class="track-background" aria-hidden="true"></div>
      <div class="track-shade" aria-hidden="true"></div>
      <h2 class="track-title"></h2>
      <div class="track-center-controls">
        <button class="card-seek card-seek-back" type="button" aria-label="Voltar 5 segundos" title="Voltar 5 segundos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <span class="track-duration" aria-label="Duração da faixa">--</span>
        <button class="card-seek card-seek-forward" type="button" aria-label="Avançar 5 segundos" title="Avançar 5 segundos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
      <button class="comment-button" type="button" title="Informações e comentários" aria-label="Abrir informações e comentários">
        <svg class="icon-info" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 10.5v6M12 7.5h.01"/>
        </svg>
        <svg class="icon-approved" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6.8 12.3 3.3 3.3 7.2-7.5"/>
        </svg>
        <span class="comment-count" hidden></span>
      </button>
      <button class="download-button" type="button" title="Baixar para este aparelho" aria-label="Baixar faixa para este aparelho">
        <span class="new-audio-badge" aria-label="Novo áudio" hidden></span>
        <svg class="icon-download" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5 18 12 8 18.5Z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 6v12M15.5 6v12"/>
        </svg>
        <svg class="icon-loading" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a9 9 0 1 1-8.3 5.5"/>
        </svg>
        <svg class="icon-delete" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>
        </svg>
      </button>
    </article>
  </template>

  <input id="audioInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.webm,.flac" hidden>
  <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>

  <dialog class="musical-dialog" id="addCardDialog" aria-labelledby="addCardDialogTitle">
    <form class="dialog-card" id="addCardForm">
      <div class="dialog-heading">
        <div>
          <span class="dialog-kicker">Novo container</span>
          <h2 id="addCardDialogTitle">Nome da faixa</h2>
        </div>
        <button class="dialog-close" id="closeAddCardDialog" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <label class="dialog-field" for="newCardTitle">
        <span>Nome da faixa</span>
        <input id="newCardTitle" maxlength="120" autocomplete="off" required placeholder="Ex.: Entrada do personagem">
      </label>
      <button class="dialog-primary" id="confirmAddCardButton" type="submit">Adicionar container</button>
    </form>
  </dialog>

  <dialog class="musical-dialog" id="commentsDialog" aria-labelledby="commentsDialogTitle">
    <section class="dialog-card comments-card">
      <div class="dialog-heading">
        <div>
          <span class="dialog-kicker">Informações e comentários</span>
          <h2 id="commentsDialogTitle">Container</h2>
        </div>
        <button class="dialog-close" id="closeCommentsDialog" type="button" aria-label="Fechar comentários">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <form class="comment-form" id="commentForm" hidden>
        <label class="dialog-field" for="commentText">
          <span>Adicionar comentário</span>
          <textarea id="commentText" maxlength="800" rows="4" required placeholder="Escreva seu comentário sobre este bloco..."></textarea>
        </label>
        <button class="dialog-primary" id="sendCommentButton" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg>
          <span>Enviar comentário</span>
        </button>
      </form>
      <button class="approve-track-button" id="approveTrackButton" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m7.8 12.2 2.7 2.7 5.9-6"/></svg>
        <span>Aprovar faixa</span>
      </button>
    </section>
  </dialog>

  <section class="player-bar" id="playerBar" aria-label="Controle da faixa atual" hidden>
    <button id="rewindButton" type="button" aria-label="Voltar 5 segundos" title="Voltar 5 segundos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8H3V4M3.5 8.5A9 9 0 1 1 4 16M9.2 10.2h3.2l-2.5 2.3h1a2.6 2.6 0 1 1-2.3 3.8"/></svg>
      <span>5</span>
    </button>
    <input id="seekSlider" type="range" min="0" max="1" step="0.01" value="0" aria-label="Posição da faixa">
    <time id="currentTimeLabel" datetime="PT0M0S">00:00</time>
    <button id="forwardButton" type="button" aria-label="Avançar 5 segundos" title="Avançar 5 segundos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 8h4V4m-.5 4.5A9 9 0 1 0 20 16M14.8 10.2h-3.2l2.5 2.3h-1a2.6 2.6 0 1 0 2.3 3.8"/></svg>
      <span>5</span>
    </button>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/musical-kelly/app.js?v=16" defer></script>
</body>
</html>
