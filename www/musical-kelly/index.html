<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110d">
  <title>Musical Kelly | Fluent LevelUp</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/musical-kelly/styles.css?v=1">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/play" aria-label="Voltar ao Fluent LevelUp">
      <img src="/SVG/logo.svg" alt="">
      <span>
        <strong>Musical Kelly</strong>
        <small>mesa de trilhas ao vivo</small>
      </span>
    </a>

    <div class="top-actions">
      <button class="icon-action" id="downloadAllButton" type="button" title="Baixar todas as faixas para este aparelho" aria-label="Baixar todas as faixas">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/>
        </svg>
        <span>Baixar tudo</span>
      </button>
      <button class="primary-action" id="addCardButton" type="button">
        <span aria-hidden="true">+</span> Nova cena
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">PLAYBACK CONTÍNUO</p>
        <h1 id="pageTitle">A trilha acompanha o palco.</h1>
        <p>Toque uma faixa para reproduzir. Segure por 500 ms para selecionar e editar.</p>
      </div>
      <div class="fade-contract" aria-label="Transição configurada">
        <span class="fade-number">3s</span>
        <span>fade total</span>
        <i aria-hidden="true"></i>
        <span class="fade-number">1s</span>
        <span>de sobreposição</span>
      </div>
    </section>

    <section class="selection-panel" id="selectionPanel" hidden aria-label="Editar container selecionado">
      <div class="selection-copy">
        <span class="selection-dot" aria-hidden="true"></span>
        <label for="titleInput">Container selecionado</label>
      </div>
      <input id="titleInput" maxlength="120" autocomplete="off" aria-label="Nome da faixa">
      <div class="selection-actions">
        <button type="button" id="chooseAudioButton"><kbd>A</kbd> Música</button>
        <button type="button" id="chooseImageButton"><kbd>P</kbd> Imagem</button>
        <button type="button" class="danger-action" id="removeCardButton" title="Remover container">Remover</button>
      </div>
    </section>

    <div class="status-line" id="statusLine" role="status" aria-live="polite">
      <span class="status-pulse" aria-hidden="true"></span>
      <span id="statusText">Carregando o musical…</span>
    </div>

    <section class="track-list" id="trackList" aria-label="Faixas do musical"></section>
  </main>

  <template id="trackTemplate">
    <article class="track-card" tabindex="0">
      <div class="track-background" aria-hidden="true"></div>
      <div class="track-shade" aria-hidden="true"></div>
      <div class="track-number" aria-hidden="true"></div>
      <div class="track-copy">
        <h2 class="track-title"></h2>
        <p class="track-file"></p>
      </div>
      <div class="track-state" aria-hidden="true">
        <span class="state-bars"><i></i><i></i><i></i></span>
        <span class="state-label">NO AR</span>
      </div>
      <button class="download-button" type="button" title="Baixar para este aparelho" aria-label="Baixar faixa para este aparelho">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/>
        </svg>
        <span class="download-label">baixar</span>
      </button>
    </article>
  </template>

  <input id="audioInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.webm,.flac" hidden>
  <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/musical-kelly/app.js?v=1" defer></script>
</body>
</html>
