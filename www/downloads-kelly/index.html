<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060607">
  <title>Vídeos da Kelly</title>
  <style>
    :root{color-scheme:dark;--bg:#060607;--panel:#101113;--edge:#25262a;--white:#f7f7f8;--muted:#96989e;--green:#73ef9b;--pink:#f45cb3;--blue:#74b8ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#182019 0,#090a0b 43%,var(--bg) 76%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,100%);margin:0 auto;padding:clamp(28px,5vw,60px) clamp(16px,4vw,40px) 60px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
    h1{margin:0;font-size:clamp(27px,4vw,42px);font-weight:720;letter-spacing:-.045em}
    .subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
    .count{flex:none;border:1px solid #35433a;background:#101812;color:var(--green);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;letter-spacing:.04em}
    .special-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0 0 34px}
    .special-card{min-width:0;padding:17px 18px;border:1px solid #344139;border-radius:18px;background:linear-gradient(150deg,#131a15,#0c0d0f 80%);box-shadow:0 16px 44px #0005}
    .special-title{margin:0 0 15px;color:var(--green);font-size:16px;font-weight:700;letter-spacing:-.015em}
    .section-heading{margin:0 0 15px;color:#d6d7da;font-size:15px;font-weight:650;letter-spacing:.01em}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{min-width:0;overflow:hidden;border:1px solid var(--edge);border-radius:18px;background:linear-gradient(160deg,#131416,#0c0d0f 80%);box-shadow:0 16px 44px #0005}
    .screen{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
    .cover{position:absolute;inset:0;display:grid;place-items:center;border:0;background:linear-gradient(145deg,#0a0d0b88,#030304a8);cursor:pointer;color:var(--white);transition:background .2s}
    .cover:hover{background:linear-gradient(145deg,#0a0d0b55,#03030476)}
    .cover[hidden]{display:none}
    .cover-icon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#07100a;box-shadow:0 0 35px #73ef9b55}
    .cover-icon svg{width:24px;height:24px;margin-left:3px}
    .card-body{padding:15px 16px 16px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .filename{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:630;line-height:1.35}
    .download{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #3b5945;border-radius:10px;background:#132018;color:#d9ffe4;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
    .download:hover{background:#1b3224;border-color:var(--green);transform:translateY(-1px)}
    .download:disabled{opacity:.55;cursor:wait;transform:none}
    .download svg{width:15px;height:15px}
    .progress-row{display:grid;grid-template-columns:1fr 42px;gap:10px;align-items:center;margin-top:14px}
    .progress{height:5px;border-radius:99px;background:#292a2d;overflow:hidden}
    .progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--pink));box-shadow:0 0 12px #73ef9b66;transition:width .12s linear}
    .progress-fill.indeterminate{width:35%;animation:move 1.1s ease-in-out infinite alternate}
    .percent{text-align:right;color:#aeb0b5;font-size:11px;font-variant-numeric:tabular-nums}
    .status{min-height:16px;margin-top:7px;color:var(--muted);font-size:11px}
    .status.ready{color:var(--green)}.status.error{color:#ff8d9b}
    .category-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .category{display:flex;min-height:82px;align-items:center;justify-content:space-between;gap:16px;padding:17px 22px;border:1px solid #2a342d;border-radius:18px;background:linear-gradient(145deg,#121713,#0b0c0d 78%);color:var(--white);text-align:left;cursor:pointer;box-shadow:0 16px 44px #0005;transition:border-color .18s,transform .18s,background .18s}
    .category:hover{border-color:var(--green);background:linear-gradient(145deg,#17221a,#0c0d0f 78%);transform:translateY(-2px)}
    .category-icon{width:56px;height:56px;flex:none;display:grid;place-items:center;padding:6px;border:1px solid #2b343c;border-radius:13px;background:#080b0d}.category-icon svg{display:block;width:100%;height:100%}
    .category-title{font-size:17px;font-weight:680;letter-spacing:-.02em}
    .category-arrow{display:grid;width:34px;height:34px;flex:none;place-items:center;border:1px solid #354139;border-radius:50%;color:var(--green)}
    .category-arrow svg{width:16px;height:16px}
    .download-modal{width:min(680px,calc(100% - 28px));max-width:none;max-height:min(82vh,820px);padding:0;border:1px solid #35383c;border-radius:20px;background:#0d0e10;color:var(--white);box-shadow:0 28px 90px #000b}
    .download-modal::backdrop{background:#000c;backdrop-filter:blur(5px)}
    .modal-shell{display:flex;max-height:min(82vh,820px);flex-direction:column}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 20px;border-bottom:1px solid #292b2e}
    .modal-title{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
    .modal-close{display:grid;width:36px;height:36px;flex:none;place-items:center;border:1px solid #383a3e;border-radius:50%;background:#17181a;color:#d8d9dc;font-size:22px;line-height:1;cursor:pointer}
    .modal-close:hover{border-color:var(--pink);color:#fff}
    .modal-list{overflow:auto;padding:6px 20px 18px}
    .download-item{padding:14px 0 13px;border-bottom:1px solid #26282b}
    .download-item:last-child{border-bottom:0}
    .download-item .filename{flex:1}
    .download-item .progress-row{margin-top:11px}
    .download-item .status{min-height:0;margin-top:6px}
    @keyframes move{to{transform:translateX(180%)}}
    @media(max-width:720px){.grid,.special-grid{grid-template-columns:1fr;gap:14px}.category-grid{grid-template-columns:1fr;gap:12px}.category{min-height:82px;padding:13px 15px;gap:12px}.category-icon{width:50px;height:50px}.category-title{font-size:16px}}
    @media(max-width:420px){main{padding-inline:12px}.card,.special-card{border-radius:15px}.card-body,.special-card{padding:13px}.filename{font-size:13px}.download{padding:9px 10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
  <link rel="stylesheet" href="/downloads-kelly/chat-widget.css">
</head>
<body>
  <main>
    <header>
      <div><h1>Downloads da Kelly</h1><p class="subtitle">Escolha uma categoria para abrir os arquivos.</p></div>
    </header>
    <section class="category-grid" id="categories" aria-label="Categorias de download"></section>
  </main>
  <dialog class="download-modal" id="download-modal" aria-labelledby="modal-title">
    <div class="modal-shell">
      <div class="modal-head"><h2 class="modal-title" id="modal-title"></h2><button class="modal-close" id="modal-close" type="button" aria-label="Fechar">×</button></div>
      <div class="modal-list" id="modal-list"></div>
    </div>
  </dialog>
  <script>
    const categoriesRoot=document.querySelector('#categories'),modal=document.querySelector('#download-modal'),modalTitle=document.querySelector('#modal-title'),modalList=document.querySelector('#modal-list');
    let controller=null;
    const svgDownload='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>';
    const svgArrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
    const svgCategory=(active)=>`<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="4" width="92" height="15" rx="1.5" fill="${active==='top'?'#0aa4e8':'#697177'}"/><rect x="4" y="23" width="14" height="73" rx="1.5" fill="${active==='left'?'#0aa4e8':'#697177'}"/><rect x="22" y="23" width="56" height="73" rx="1.5" fill="${active==='main'?'#0aa4e8':'#697177'}"/><rect x="82" y="23" width="14" height="73" rx="1.5" fill="${active==='right'?'#0aa4e8':'#697177'}"/></svg>`;
    function safeName(name){return String(name).replace(/[\\/:*?"<>|]/g,'_');}
    function escapeHTML(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
    function setProgress(card,loaded,total){const percent=total?Math.min(100,Math.floor(loaded/total*100)):0;card.fill.style.width=`${percent}%`;card.percent.textContent=total?`${percent}%`:'…';card.fill.classList.toggle('indeterminate',!total);}
    function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeName(name);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
    async function downloadFile(card){
      if(controller)controller.abort();
      controller=new AbortController();const request=controller;card.button.disabled=true;card.status.className='status';card.status.textContent='Baixando…';card.fill.style.width='0%';card.percent.textContent='0%';card.fill.classList.remove('indeterminate');
      try{
        const response=await fetch(card.url,{signal:request.signal,mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('download');
        const total=Number(response.headers.get('content-length'))||0,reader=response.body.getReader(),chunks=[];let loaded=0;
        while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);loaded+=value.byteLength;setProgress(card,loaded,total)}
        const blob=new Blob(chunks,{type:'video/mp4'});saveBlob(blob,card.file);card.status.className='status ready';card.status.textContent='Download concluído';setProgress(card,loaded,total||loaded);card.button.disabled=false;if(controller===request)controller=null;
      }catch(error){if(error.name==='AbortError'){card.status.textContent='Download pausado';card.button.disabled=false;if(controller===request)controller=null;return}card.status.className='status error';card.status.textContent='Não foi possível baixar. Tente novamente.';card.percent.textContent='—';card.fill.classList.remove('indeterminate');card.button.disabled=false;if(controller===request)controller=null;}
    }
    async function init(){
      try{
        const [specialResponse,response]=await Promise.all([fetch('/downloads-kelly/special-downloads.json',{cache:'no-store'}),fetch('/downloads-kelly/videos.json',{cache:'no-store'})]);if(!response.ok||!specialResponse.ok)throw new Error('manifest');const extras=await specialResponse.json(),items=await response.json();
        const categories=[{title:'Telão principal',icon:svgCategory('main'),items},{title:'Testeira Superior',icon:svgCategory('top'),items:extras.filter(item=>item.title==='Testeira Superior')},{title:'Lateral esquerda',icon:svgCategory('left'),items:extras.filter(item=>item.title==='Lateral esquerda')},{title:'Lateral direita',icon:svgCategory('right'),items:extras.filter(item=>item.title==='Lateral direita')}];
        categoriesRoot.innerHTML=categories.map((category,index)=>`<button class="category" type="button" data-category="${index}"><span class="category-icon">${category.icon}</span><span class="category-title">${escapeHTML(category.title)}</span><span class="category-arrow">${svgArrow}</span></button>`).join('');
        categoriesRoot.querySelectorAll('.category').forEach((button,index)=>button.addEventListener('click',()=>openCategory(categories[index])));
      }catch{categoriesRoot.innerHTML='<p>Não foi possível carregar os downloads agora.</p>'}
    }
    function openCategory(category){modalTitle.textContent=category.title;modalList.innerHTML=category.items.map((item,index)=>`<div class="download-item" data-download-index="${index}"><div class="row"><div class="filename">${escapeHTML(item.file)}</div><button class="download" type="button">${svgDownload}<span>Baixar</span></button></div><div class="progress-row"><div class="progress" role="progressbar" aria-label="Progresso do download"><div class="progress-fill"></div></div><span class="percent"></span></div><div class="status" aria-live="polite"></div></div>`).join('');category.items.forEach((item,index)=>{const element=modalList.querySelector(`[data-download-index="${index}"]`),card={...item,fill:element.querySelector('.progress-fill'),percent:element.querySelector('.percent'),status:element.querySelector('.status'),button:element.querySelector('.download')};card.button.addEventListener('click',()=>downloadFile(card))});modal.showModal();}
    document.querySelector('#modal-close').addEventListener('click',()=>modal.close());
    modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});
    init();
  </script>
  <button class="chat-launcher" id="kelly-chat-launcher" type="button" aria-expanded="false" aria-controls="kelly-chat-panel"><span class="chat-launcher__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.6 8.6 0 0 1-4-.98L3 21l1.98-5.5A8.6 8.6 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></span><span>Falar com Editor</span><span class="chat-launcher__badge" id="kelly-chat-badge" hidden></span></button>
  <section class="chat-panel" id="kelly-chat-panel" aria-label="Chat com o administrador" hidden>
    <header class="chat-panel__head"><div class="chat-panel__brand"><span class="chat-panel__mark">F</span><span><strong>Falar com Editor</strong><small>Tire suas dúvidas com o Editor</small></span></div><button class="chat-panel__close" id="kelly-chat-close" type="button" aria-label="Minimizar chat">×</button></header>
    <div class="chat-panel__feed" id="kelly-chat-feed" aria-live="polite"><p class="chat-panel__welcome">Oi! Mande sua mensagem e a gente responde por aqui.</p></div>
    <form class="chat-panel__composer" id="kelly-chat-form"><div class="chat-panel__attachment" id="kelly-chat-attachment" hidden><img alt="Imagem pronta para enviar"><button type="button" aria-label="Remover imagem">×</button><small>Toque para expandir</small></div><textarea id="kelly-chat-input" maxlength="2000" rows="1" placeholder="Escreva uma mensagem..." aria-label="Escreva uma mensagem"></textarea><button type="submit" aria-label="Enviar mensagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
  </section>
  <dialog class="chat-notice" id="kelly-chat-notice" aria-labelledby="kelly-chat-notice-title"><div class="chat-notice__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.6 8.6 0 0 1-4-.98L3 21l1.98-5.5A8.6 8.6 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 12h8M8 15.5h5"/></svg></div><h2 id="kelly-chat-notice-title">Nova mensagem do Editor</h2><button id="kelly-chat-notice-ok" type="button">Ok</button></dialog>
  <dialog class="chat-image-viewer" id="kelly-chat-image-viewer" aria-label="Imagem ampliada"><button type="button" aria-label="Fechar imagem">×</button><img alt="Imagem em tela cheia"></dialog>
  <script src="/downloads-kelly/chat-widget.js" defer></script>
</body>
</html>
