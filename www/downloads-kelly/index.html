<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060607">
  <title>Vídeos da Kelly</title>
  <style>
    :root{color-scheme:dark;--bg:#060607;--panel:#101113;--edge:#25262a;--white:#f7f7f8;--muted:#96989e;--green:#73ef9b;--pink:#f45cb3;--blue:#74b8ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#182019 0,#090a0b 43%,var(--bg) 76%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,100%);margin:0 auto;padding:clamp(28px,5vw,60px) clamp(16px,4vw,40px) 60px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
    h1{margin:0;font-size:clamp(27px,4vw,42px);font-weight:720;letter-spacing:-.045em}
    .subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
    .count{flex:none;border:1px solid #35433a;background:#101812;color:var(--green);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;letter-spacing:.04em}
    .special-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0 0 34px}
    .special-card{min-width:0;padding:17px 18px;border:1px solid #344139;border-radius:18px;background:linear-gradient(150deg,#131a15,#0c0d0f 80%);box-shadow:0 16px 44px #0005}
    .special-title{margin:0 0 15px;color:var(--green);font-size:16px;font-weight:700;letter-spacing:-.015em}
    .section-heading{margin:0 0 15px;color:#d6d7da;font-size:15px;font-weight:650;letter-spacing:.01em}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{min-width:0;overflow:hidden;border:1px solid var(--edge);border-radius:18px;background:linear-gradient(160deg,#131416,#0c0d0f 80%);box-shadow:0 16px 44px #0005}
    .screen{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
    .cover{position:absolute;inset:0;display:grid;place-items:center;border:0;background:linear-gradient(145deg,#0a0d0b88,#030304a8);cursor:pointer;color:var(--white);transition:background .2s}
    .cover:hover{background:linear-gradient(145deg,#0a0d0b55,#03030476)}
    .cover[hidden]{display:none}
    .cover-icon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#07100a;box-shadow:0 0 35px #73ef9b55}
    .cover-icon svg{width:24px;height:24px;margin-left:3px}
    .card-body{padding:15px 16px 16px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .filename{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:630;line-height:1.35}
    .download{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #3b5945;border-radius:10px;background:#132018;color:#d9ffe4;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
    .download:hover{background:#1b3224;border-color:var(--green);transform:translateY(-1px)}
    .download:disabled{opacity:.55;cursor:wait;transform:none}
    .download svg{width:15px;height:15px}
    .progress-row{display:grid;grid-template-columns:1fr 42px;gap:10px;align-items:center;margin-top:14px}
    .progress{height:5px;border-radius:99px;background:#292a2d;overflow:hidden}
    .progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--pink));box-shadow:0 0 12px #73ef9b66;transition:width .12s linear}
    .progress-fill.indeterminate{width:35%;animation:move 1.1s ease-in-out infinite alternate}
    .percent{text-align:right;color:#aeb0b5;font-size:11px;font-variant-numeric:tabular-nums}
    .status{min-height:16px;margin-top:7px;color:var(--muted);font-size:11px}
    .status.ready{color:var(--green)}.status.error{color:#ff8d9b}
    .category-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .category{display:flex;min-height:82px;align-items:center;justify-content:space-between;gap:16px;padding:17px 22px;border:1px solid #2a342d;border-radius:18px;background:linear-gradient(145deg,#121713,#0b0c0d 78%);color:var(--white);text-align:left;cursor:pointer;box-shadow:0 16px 44px #0005;transition:border-color .18s,transform .18s,background .18s}
    .category:hover{border-color:var(--green);background:linear-gradient(145deg,#17221a,#0c0d0f 78%);transform:translateY(-2px)}
    .category-icon{width:56px;height:56px;flex:none;display:grid;place-items:center;padding:6px;border:1px solid #2b343c;border-radius:13px;background:#080b0d}.category-icon svg{display:block;width:100%;height:100%}
    .category-title{font-size:17px;font-weight:680;letter-spacing:-.02em}
    .category-arrow{display:grid;width:34px;height:34px;flex:none;place-items:center;border:1px solid #354139;border-radius:50%;color:var(--green)}
    .category-arrow svg{width:16px;height:16px}
    .download-modal{width:min(680px,calc(100% - 28px));max-width:none;max-height:min(82vh,820px);padding:0;border:1px solid #35383c;border-radius:20px;background:#0d0e10;color:var(--white);box-shadow:0 28px 90px #000b}
    .download-modal::backdrop{background:#000c;backdrop-filter:blur(5px)}
    .modal-shell{display:flex;max-height:min(82vh,820px);flex-direction:column}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 20px;border-bottom:1px solid #292b2e}
    .modal-title{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
    .modal-close{display:grid;width:36px;height:36px;flex:none;place-items:center;border:1px solid #383a3e;border-radius:50%;background:#17181a;color:#d8d9dc;font-size:22px;line-height:1;cursor:pointer}
    .modal-close:hover{border-color:var(--pink);color:#fff}
    .modal-list{overflow:auto;padding:6px 20px 18px}
    .download-item{padding:14px 0 13px;border-bottom:1px solid #26282b}
    .download-item:last-child{border-bottom:0}
    .download-item .filename{flex:1}
    .download-item .progress-row{margin-top:11px}
    .download-item .status{min-height:0;margin-top:6px}
    .download-item.admin-selected{margin-inline:-10px;padding-inline:10px;border-radius:10px;background:#0d1c2a;outline:1px solid #2875b9}.admin-hint{margin:9px 0 0;color:#7f9fbc;font-size:11px;line-height:1.4}
    .file-context{position:fixed;z-index:80;min-width:180px;padding:5px;border:1px solid #35404a;border-radius:12px;background:#111519;box-shadow:0 16px 42px #000b}.file-context[hidden]{display:none}.file-context button{width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#e7edf3;text-align:left;font:600 12px inherit;cursor:pointer}.file-context button:hover{background:#1d2c3b;color:#8ecaff}
    .admin-file-dialog{width:min(440px,calc(100% - 28px));max-width:none;padding:0;border:1px solid #34404a;border-radius:18px;background:#0d1013;color:var(--white);box-shadow:0 28px 90px #000c}.admin-file-dialog::backdrop{background:#000c;backdrop-filter:blur(5px)}.admin-file-shell{padding:21px}.admin-file-shell h2{margin:0 0 8px;font-size:19px}.admin-file-description{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.5}.admin-file-shell label{display:block;margin:13px 0 6px;color:#b9c0c7;font-size:11px;font-weight:700}.admin-file-shell input,.admin-file-shell select{width:100%;min-height:42px;padding:10px 11px;border:1px solid #303941;border-radius:10px;background:#111519;color:#f5f7f9;font:13px inherit}.admin-file-shell input[type=file]{font-size:11px}.admin-file-fields[hidden]{display:none}.admin-file-status{min-height:17px;margin-top:10px;color:#ff8d9b;font-size:11px}.admin-file-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.admin-file-actions button{padding:10px 15px;border:1px solid #3c454c;border-radius:10px;background:#171c20;color:#e5e9ec;font:650 12px inherit;cursor:pointer}.admin-file-actions button[type=submit]{border-color:#3686c7;background:#1677bd;color:white}.admin-file-actions button:disabled{opacity:.55;cursor:wait}
    @keyframes move{to{transform:translateX(180%)}}
    @media(max-width:720px){.grid,.special-grid{grid-template-columns:1fr;gap:14px}.category-grid{grid-template-columns:1fr;gap:12px}.category{min-height:82px;padding:13px 15px;gap:12px}.category-icon{width:50px;height:50px}.category-title{font-size:16px}}
    @media(max-width:420px){main{padding-inline:12px}.card,.special-card{border-radius:15px}.card-body,.special-card{padding:13px}.filename{font-size:13px}.download{padding:9px 10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
  <link rel="stylesheet" href="/downloads-kelly/chat-widget.css">
</head>
<body>
  <main>
    <header>
      <div><h1>Downloads da Kelly</h1><p class="subtitle">Escolha uma categoria para abrir os arquivos.</p></div>
    </header>
    <section class="category-grid" id="categories" aria-label="Categorias de download"></section>
  </main>
  <dialog class="download-modal" id="download-modal" aria-labelledby="modal-title">
    <div class="modal-shell">
      <div class="modal-head"><h2 class="modal-title" id="modal-title"></h2><button class="modal-close" id="modal-close" type="button" aria-label="Fechar">×</button></div>
      <div class="modal-list" id="modal-list"></div>
    </div>
  </dialog>
  <div class="file-context" id="file-context-menu" role="menu" hidden><button id="file-rename-action" type="button" role="menuitem">Renomear no front</button></div>
  <dialog class="admin-file-dialog" id="admin-file-dialog" aria-labelledby="admin-file-title"><form class="admin-file-shell" id="admin-file-form"><h2 id="admin-file-title">Novo arquivo</h2><p class="admin-file-description" id="admin-file-description"></p><label for="admin-file-name">Nome exibido no site</label><input id="admin-file-name" maxlength="180" autocomplete="off"><div class="admin-file-fields" id="admin-create-fields"><label for="admin-file-category">Container</label><select id="admin-file-category"><option value="main">Telão principal</option><option value="top">Testeira Superior</option><option value="sides">Laterais</option></select><label for="admin-video-input">Vídeo MP4</label><input id="admin-video-input" type="file" accept="video/mp4,.mp4"></div><div class="admin-file-status" id="admin-file-status" aria-live="polite"></div><div class="admin-file-actions"><button id="admin-file-cancel" type="button">Cancelar</button><button id="admin-file-save" type="submit">Salvar</button></div></form></dialog>
  <input id="admin-replace-input" type="file" accept="video/mp4,.mp4" hidden>
  <script>
    const categoriesRoot=document.querySelector('#categories'),modal=document.querySelector('#download-modal'),modalTitle=document.querySelector('#modal-title'),modalList=document.querySelector('#modal-list');
    const contextMenu=document.querySelector('#file-context-menu'),renameAction=document.querySelector('#file-rename-action');
    const adminDialog=document.querySelector('#admin-file-dialog'),adminForm=document.querySelector('#admin-file-form'),adminTitle=document.querySelector('#admin-file-title'),adminDescription=document.querySelector('#admin-file-description'),adminName=document.querySelector('#admin-file-name'),adminCreateFields=document.querySelector('#admin-create-fields'),adminCategory=document.querySelector('#admin-file-category'),adminVideo=document.querySelector('#admin-video-input'),adminStatus=document.querySelector('#admin-file-status'),adminSave=document.querySelector('#admin-file-save'),replaceVideo=document.querySelector('#admin-replace-input');
    let controller=null,categories=[],adminMode=false,activeFile=null,activeCategory=null,adminModeAction='create',cPresses=0,cPressTimer=null;
    const svgDownload='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>';
    const svgArrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
    const svgCategory=(active)=>`<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="4" y="4" width="92" height="15" rx="1.5" fill="${active==='top'?'#0aa4e8':'#697177'}"/><rect x="4" y="23" width="14" height="73" rx="1.5" fill="${active==='sides'||active==='left'?'#0aa4e8':'#697177'}"/><rect x="22" y="23" width="56" height="73" rx="1.5" fill="${active==='main'?'#0aa4e8':'#697177'}"/><rect x="82" y="23" width="14" height="73" rx="1.5" fill="${active==='sides'||active==='right'?'#0aa4e8':'#697177'}"/></svg>`;
    function safeName(name){return String(name).replace(/[\\/:*?"<>|]/g,'_');}
    function escapeHTML(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
    function setProgress(card,loaded,total){const percent=total?Math.min(100,Math.floor(loaded/total*100)):0;card.fill.style.width=`${percent}%`;card.percent.textContent=total?`${percent}%`:'…';card.fill.classList.toggle('indeterminate',!total);}
    function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeName(name);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
    async function downloadFile(card){
      if(controller)controller.abort();
      controller=new AbortController();const request=controller;card.button.disabled=true;card.status.className='status';card.status.textContent='Baixando…';card.fill.style.width='0%';card.percent.textContent='0%';card.fill.classList.remove('indeterminate');
      try{
        const response=await fetch(card.url,{signal:request.signal,mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('download');
        const total=Number(response.headers.get('content-length'))||0,reader=response.body.getReader(),chunks=[];let loaded=0;
        while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);loaded+=value.byteLength;setProgress(card,loaded,total)}
        const blob=new Blob(chunks,{type:'video/mp4'});saveBlob(blob,card.file);card.status.className='status ready';card.status.textContent='Download concluído';setProgress(card,loaded,total||loaded);card.button.disabled=false;if(controller===request)controller=null;
      }catch(error){if(error.name==='AbortError'){card.status.textContent='Download pausado';card.button.disabled=false;if(controller===request)controller=null;return}card.status.className='status error';card.status.textContent='Não foi possível baixar. Tente novamente.';card.percent.textContent='—';card.fill.classList.remove('indeterminate');card.button.disabled=false;if(controller===request)controller=null;}
    }
    function mapFiles(files){return [{title:'Telão principal',category:'main',icon:svgCategory('main'),items:files.filter(item=>item.category==='main')},{title:'Testeira Superior',category:'top',icon:svgCategory('top'),items:files.filter(item=>item.category==='top')},{title:'Laterais',category:'sides',icon:svgCategory('sides'),items:files.filter(item=>item.category==='sides')}];}
    function renderCategories(){categoriesRoot.innerHTML=categories.map((category,index)=>`<button class="category" type="button" data-category="${index}"><span class="category-icon">${category.icon}</span><span class="category-title">${escapeHTML(category.title)}</span><span class="category-arrow">${svgArrow}</span></button>`).join('');categoriesRoot.querySelectorAll('.category').forEach((button,index)=>button.addEventListener('click',()=>openCategory(categories[index])));}
    async function readCatalog(){const response=await fetch('/api/downloads-kelly/files',{cache:'no-store'});if(!response.ok)throw new Error('catalog');const payload=await response.json();const adminResponse=await fetch('/api/downloads-kelly/admin/files',{cache:'no-store'});adminMode=adminResponse.ok;return payload.files||[];}
    async function refreshCatalog(reopenTitle=''){const files=await readCatalog();categories=mapFiles(files);renderCategories();if(reopenTitle){const category=categories.find(item=>item.title===reopenTitle);if(category)openCategory(category);}}
    async function init(){try{await refreshCatalog();}catch{try{const [specialResponse,response]=await Promise.all([fetch('/downloads-kelly/special-downloads.json',{cache:'no-store'}),fetch('/downloads-kelly/videos.json',{cache:'no-store'})]);if(!response.ok||!specialResponse.ok)throw new Error('manifest');const extras=await specialResponse.json(),items=await response.json();const files=[...items.map(item=>({...item,category:'main'})),...extras.filter(item=>item.title==='Testeira Superior').map(item=>({...item,category:'top'})),...extras.filter(item=>item.title==='Laterais'||item.title==='Lateral esquerda'||item.title==='Lateral direita').map(item=>({...item,category:'sides'}))];adminMode=false;categories=mapFiles(files);renderCategories();}catch{categoriesRoot.innerHTML='<p>Não foi possível carregar os downloads agora.</p>'}}}
    function selectFile(item,element){if(!adminMode)return;activeFile=item;activeCategory=categories.find(category=>category.category===item.category)||activeCategory;modalList.querySelectorAll('.admin-selected').forEach(node=>node.classList.remove('admin-selected'));element.classList.add('admin-selected');}
    function showFileContext(event,item,element){if(!adminMode)return;event.preventDefault();selectFile(item,element);contextMenu.hidden=false;contextMenu.style.left=`${Math.min(event.clientX,innerWidth-200)}px`;contextMenu.style.top=`${Math.min(event.clientY,innerHeight-55)}px`;}
    function openAdminDialog(mode,item=activeFile){adminModeAction=mode;adminStatus.textContent='';adminForm.reset();adminName.value=item?.file||'';adminCreateFields.hidden=mode!=='create';adminTitle.textContent=mode==='rename'?'Renomear no front':'Novo arquivo';adminDescription.textContent=mode==='rename'?'Altere apenas o nome que aparece na página.':'Escolha o container, informe o nome exibido e selecione o vídeo MP4.';if(mode==='create')adminCategory.value=activeCategory?.category||'main';adminSave.textContent=mode==='rename'?'Salvar nome':'Enviar vídeo';adminDialog.showModal();adminName.focus();}
    async function replaceSelectedVideo(file){if(!activeFile||!file)return;const button=modalList.querySelector(`[data-file-id="${CSS.escape(String(activeFile.id))}"] .download`),originalMarkup=button?.innerHTML;if(button){button.disabled=true;button.innerHTML='<span>Enviando…</span>';}try{const response=await fetch(`/api/downloads-kelly/admin/files/${encodeURIComponent(activeFile.id)}/replace`,{method:'POST',headers:{'Content-Type':'video/mp4'},body:file});const payload=await response.json();if(!response.ok)throw new Error(payload.message||'Não foi possível substituir.');await refreshCatalog(activeCategory?.title||'');}catch(error){alert(error.message||'Não foi possível substituir o vídeo.');if(button){button.innerHTML=originalMarkup;button.disabled=false;}}finally{replaceVideo.value='';}}
    function openCategory(category){activeCategory=category;activeFile=null;modalTitle.textContent=category.title;const hint=adminMode?'<p class="admin-hint">Clique em um arquivo e pressione C para substituir · CCC para criar · botão direito para renomear.</p>':'';modalList.innerHTML=hint+category.items.map((item,index)=>`<div class="download-item" data-download-index="${index}" data-file-id="${escapeHTML(item.id||'')}"><div class="row"><div class="filename">${escapeHTML(item.file)}</div><button class="download" type="button">${svgDownload}<span>Baixar</span></button></div><div class="progress-row"><div class="progress" role="progressbar" aria-label="Progresso do download"><div class="progress-fill"></div></div><span class="percent"></span></div><div class="status" aria-live="polite"></div></div>`).join('');category.items.forEach((item,index)=>{const element=modalList.querySelector(`[data-download-index="${index}"]`),card={...item,fill:element.querySelector('.progress-fill'),percent:element.querySelector('.percent'),status:element.querySelector('.status'),button:element.querySelector('.download')};card.button.addEventListener('click',()=>downloadFile(card));element.addEventListener('click',()=>selectFile(item,element));element.addEventListener('contextmenu',event=>showFileContext(event,item,element));});if(!modal.open)modal.showModal();}
    document.querySelector('#modal-close').addEventListener('click',()=>modal.close());
    modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});
    document.querySelector('#admin-file-cancel').addEventListener('click',()=>adminDialog.close());
    renameAction.addEventListener('click',()=>{contextMenu.hidden=true;openAdminDialog('rename',activeFile)});
    document.addEventListener('click',event=>{if(!contextMenu.contains(event.target))contextMenu.hidden=true;});
    document.addEventListener('keydown',event=>{
      if(!adminMode||event.key.toLowerCase()!=='c'||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
      if(event.target instanceof HTMLElement&&(event.target.matches('input,textarea,select,[contenteditable="true"]')||adminDialog.open))return;
      event.preventDefault();cPresses+=1;clearTimeout(cPressTimer);
      if(cPresses>=3){cPresses=0;openAdminDialog('create');return;}
      cPressTimer=setTimeout(()=>{const shouldReplace=cPresses===1&&activeFile;cPresses=0;if(shouldReplace)replaceVideo.click();},520);
    });
    replaceVideo.addEventListener('change',()=>{const file=replaceVideo.files?.[0];if(file)replaceSelectedVideo(file);});
    adminForm.addEventListener('submit',async event=>{
      event.preventDefault();adminStatus.textContent='';const oldTitle=activeCategory?.title||'';adminSave.disabled=true;
      try{
        let response;
        if(adminModeAction==='rename'){
          response=await fetch(`/api/downloads-kelly/admin/files/${encodeURIComponent(activeFile.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:adminName.value})});
        }else{
          const file=adminVideo.files?.[0];if(!file)throw new Error('Escolha um vídeo MP4.');
          const query=new URLSearchParams({category:adminCategory.value,name:adminName.value});
          response=await fetch(`/api/downloads-kelly/admin/files?${query}`,{method:'POST',headers:{'Content-Type':'video/mp4'},body:file});
        }
        const payload=await response.json();if(!response.ok)throw new Error(payload.message||'Não foi possível salvar.');adminDialog.close();await refreshCatalog(oldTitle);
      }catch(error){adminStatus.textContent=error.message||'Não foi possível salvar.';}
      finally{adminSave.disabled=false;}
    });
    init();
  </script>
  <button class="chat-launcher" id="kelly-chat-launcher" type="button" aria-expanded="false" aria-controls="kelly-chat-panel"><span class="chat-launcher__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.6 8.6 0 0 1-4-.98L3 21l1.98-5.5A8.6 8.6 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></span><span>Falar com Editor</span><span class="chat-launcher__badge" id="kelly-chat-badge" hidden></span></button>
  <section class="chat-panel" id="kelly-chat-panel" aria-label="Chat com o administrador" hidden>
    <header class="chat-panel__head"><div class="chat-panel__brand"><span class="chat-panel__mark">F</span><span><strong>Falar com Editor</strong><small>Tire suas dúvidas com o Editor</small></span></div><button class="chat-panel__close" id="kelly-chat-close" type="button" aria-label="Minimizar chat">×</button></header>
    <div class="chat-panel__feed" id="kelly-chat-feed" aria-live="polite"><p class="chat-panel__welcome">Oi! Mande sua mensagem e a gente responde por aqui.</p></div>
    <form class="chat-panel__composer" id="kelly-chat-form"><input id="kelly-chat-image-file" type="file" accept="image/*" hidden><button class="chat-panel__attach-button" id="kelly-chat-attach" type="button" aria-label="Anexar imagem" title="Anexar imagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.65l-9.2 9.2a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg></button><textarea id="kelly-chat-input" maxlength="2000" rows="1" placeholder="Escreva uma mensagem..." aria-label="Escreva uma mensagem"></textarea><button type="submit" aria-label="Enviar mensagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
  </section>
  <dialog class="chat-notice" id="kelly-chat-notice" aria-labelledby="kelly-chat-notice-title"><div class="chat-notice__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.6 8.6 0 0 1-4-.98L3 21l1.98-5.5A8.6 8.6 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 12h8M8 15.5h5"/></svg></div><h2 id="kelly-chat-notice-title">Nova mensagem do Editor</h2><button id="kelly-chat-notice-ok" type="button">Ok</button></dialog>
  <dialog class="chat-image-viewer" id="kelly-chat-image-viewer" aria-label="Imagem ampliada"><button type="button" aria-label="Fechar imagem">×</button><img alt="Imagem em tela cheia"></dialog>
  <script src="/downloads-kelly/chat-widget.js" defer></script>
</body>
