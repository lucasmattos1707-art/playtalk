<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Checklist colaborativo do espetáculo de Oz.">
  <title>CheckList Mestre</title>
  <link rel="icon" type="image/svg+xml" href="/oz/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/oz/style.css?v=20261009-oz-star-hold-until-close">
  <script src="/oz/app.js?v=20261009-oz-star-hold-until-close" defer></script>
</head>
<body>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>
  <main class="login-screen" id="loginScreen">
    <form class="login-card" id="pageLoginForm">
      <h1>Entre com seu usuario</h1>
      <input id="pageLoginName" name="name" maxlength="60" autocomplete="username" placeholder="Usuario" aria-label="Usuario" required>
      <button type="submit">Entrar</button>
      <p class="login-error" id="loginError" role="status" hidden></p>
    </form>
  </main>

  <main class="page-shell" id="checklistApp" hidden>
    <header class="topline">
      <div class="profile-summary">
        <button class="team-account" id="accountButton" type="button" aria-label="Opções do usuario" aria-expanded="false" aria-controls="accountMenu">
          <span class="profile-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3"></circle><path d="M5.5 20c.3-4 2.6-6 6.5-6s6.2 2 6.5 6"></path></svg></span>
          <span id="currentMemberLabel"></span>
        </button>
      </div>
      <div class="star-balance" aria-label="Estrelas conquistadas"><img src="/oz/icons/star.svg" alt=""><strong id="starCount">0</strong></div>
      <button class="badge-album-button" type="button" disabled aria-label="Álbum de selos ainda indisponível" title="Álbum de selos em breve">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.9-.9 5.6-.5 8 1.2v13c-2.4-1.7-5.1-2.1-8-1.2z"></path><path d="M20 5.5c-2.9-.9-5.6-.5-8 1.2v13c2.4-1.7 5.1-2.1 8-1.2z"></path><path d="M12 6.7v13"></path><path d="m7 9 1.2 1.2L10 8.5m7 1.5h1"></path></svg>
      </button>
      <div class="account-menu" id="accountMenu" hidden><button type="button" data-account-action="logout">Sair</button></div>
    </header>

    <section class="page-intro">
      <div class="page-title"><h1>CheckList Mestre</h1><p>WICKED: O OUTRO LADO DE OZ</p><div class="event-countdown" id="eventCountdown" aria-live="off"></div></div>
      <div class="overview" aria-label="Progresso geral">
        <div class="overview-top"><span>PROGRESSO GERAL</span><strong id="overallPercent">0%</strong></div>
        <div class="overview-track"><span id="overallBar"></span></div>
        <div class="overview-bottom"><span id="overallSummary">Carregando checklist…</span></div>
      </div>
    </section>

    <div class="category-list" id="categoryList" aria-live="polite">
      <div class="loading-state"><span class="loader"></span><span>Carregando checklist…</span></div>
    </div>
    <div class="list-actions">
      <div class="add-menu-wrap">
        <div class="add-menu" id="addMenu" hidden>
          <button type="button" data-menu-action="category"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Categoria</span></button>
          <button type="button" data-menu-action="team"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 20c.2-3.5 2-5.3 5.5-5.3 1.8 0 3.2.5 4.1 1.5M16 8v8M12 12h8"></path></svg><span>Equipe</span></button>
        </div>
        <button class="add-category" id="toggleAddMenu" type="button" aria-label="Adicionar categoria ou equipe" aria-expanded="false" aria-controls="addMenu"><span aria-hidden="true">+</span></button>
      </div>
    </div>
  </main>

  <dialog class="category-dialog" id="categoryDialog">
    <form id="newCategoryForm" method="dialog">
      <button class="dialog-close" type="button" id="closeCategoryDialog" aria-label="Fechar">×</button>
      <span class="dialog-icon" aria-hidden="true">✨</span>
      <h2>Nova categoria</h2>
      <label for="newCategoryTitle">Nome da categoria</label>
      <input id="newCategoryTitle" name="title" maxlength="200" placeholder="Ex.: Ensaio geral" required>
      <label for="newCategoryIcon">Emoji do título</label>
      <select id="newCategoryIcon" name="icon">
        <option>✨</option><option>🎭</option><option>🎟️</option><option>💃</option><option>🎨</option><option>🎶</option><option>💡</option><option>🌟</option><option>🎤</option><option>🪄</option><option>💛</option><option>🧹</option>
      </select>
      <button class="dialog-submit" type="submit">Adicionar categoria <span aria-hidden="true">↗</span></button>
    </form>
  </dialog>
  <dialog class="team-dialog" id="teamDialog">
    <section class="team-panel">
      <button class="dialog-close" type="button" id="closeTeamDialog" aria-label="Fechar">×</button>
      <div class="team-title-row"><span class="team-dialog-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 20c.2-3.5 2-5.3 5.5-5.3M16 8v8M12 12h8"></path></svg></span><div><h2>Equipe</h2></div></div>
      <p class="team-error" id="teamError" role="status" hidden></p>
      <form id="newMemberForm" class="new-member-form">
        <label for="newMemberName">Nome do novo integrante</label>
        <div class="team-login-row"><input id="newMemberName" name="name" maxlength="60" placeholder="Nome completo" required><button type="submit">Adicionar</button></div>
      </form>
    </section>
  </dialog>
  <dialog class="status-dialog" id="statusDialog" aria-labelledby="statusDialogTitle">
    <section class="status-panel">
      <button class="dialog-close" type="button" id="closeStatusDialog" aria-label="Fechar">×</button>
      <p class="status-eyebrow" id="statusDialogTitle">STATUS DA TAREFA</p>
      <h2 id="statusTaskTitle"></h2>
      <div class="status-options" id="statusOptions"></div>
    </section>
  </dialog>
  <dialog class="category-dialog subtask-dialog" id="subtaskDialog">
    <form id="newSubtaskForm">
      <button class="dialog-close" type="button" id="closeSubtaskDialog" aria-label="Fechar">×</button>
      <span class="dialog-icon" aria-hidden="true">📂</span>
      <h2>Criar subtarefa</h2>
      <label for="newSubtaskTitle">Uma subtarefa por linha</label>
      <textarea id="newSubtaskTitle" name="titles" rows="5" maxlength="26000" placeholder="Ex.:&#10;Conferir figurinos&#10;Separar acessórios&#10;Organizar camarim" required></textarea>
      <p class="subtask-error" id="subtaskError" role="status" hidden></p>
      <button class="dialog-submit" type="submit">Criar subtarefa <span aria-hidden="true">↗</span></button>
    </form>
  </dialog>
  <dialog class="notes-dialog" id="notesDialog" aria-labelledby="notesHeading">
    <section class="notes-panel" id="notesCard">
      <button class="dialog-close" type="button" id="closeNotesDialog" aria-label="Fechar">×</button>
      <h2 id="notesTaskTitle"></h2>
      <div class="notes-divider" aria-hidden="true"></div>
      <div class="notes-content">
        <h3 id="notesHeading"></h3>
        <p id="notesText" class="notes-text"></p>
        <textarea id="notesEditor" maxlength="4000" placeholder="Escreva sua nota..."></textarea>
      </div>
      <div class="notes-nav" id="notesNav" hidden>
        <button type="button" data-note-step="-1" aria-label="Nota anterior"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button>
        <div class="notes-dots" id="notesDots"></div>
        <button type="button" data-note-step="1" aria-label="Próxima nota"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <p class="notes-counter" id="notesCounter" hidden></p>
      <p class="notes-error" id="notesError" role="status" hidden></p>
      <p class="notes-success" id="notesSuccess" role="status" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m8.5 12.2 2.3 2.3 4.8-5"></path></svg><span>Salvo com sucesso</span></p>
      <div class="notes-toolbar" id="notesToolbar"></div>
    </section>
  </dialog>
  <dialog class="microtask-notes-dialog" id="microtaskNotesDialog" aria-labelledby="microtaskNotesTitle">
    <section class="microtask-notes-panel">
      <button class="dialog-close" type="button" id="closeMicrotaskNotesDialog" aria-label="Fechar">×</button>
      <p class="notes-eyebrow">NOTAS DA MICROTAREFA</p>
      <h2 id="microtaskNotesTitle"></h2>
      <div class="microtask-notes-list" id="microtaskNotesList"></div>
    </section>
  </dialog>
  <dialog class="star-celebration" id="starCelebrationDialog" aria-labelledby="starCelebrationHeading">
    <section class="star-celebration-content">
      <p id="starCelebrationHeading">Você ganhou</p>
      <img class="star-celebration-icon" src="/oz/icons/star.svg" alt="Estrela">
      <strong id="awardedStars"></strong>
      <div class="star-celebration-earned" id="starCelebrationEarned" aria-hidden="true"></div>
    </section>
  </dialog>
  <audio id="starCelebrationAudio" src="/oz/audio/5star.mp3" preload="auto"></audio>
  <div class="task-options-menu" id="taskOptionsMenu" role="menu" aria-label="Opções da tarefa" hidden></div>
  <div class="task-assign-menu" id="taskAssignMenu" hidden></div>
</body>
</html>
